server:
  port: 8083

spring:
  application:
    name: ledger-service
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
    username: ${DB_USER:banking}
    password: ${DB_PASS:banking1234}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:3}
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 명시하지 않으면 delivery.timeout 이 120s, max.block 이 60s 다. 브로커가 느려질
      # 때 릴레이 한 주기가 그만큼 늘어져 폴링 간격(2s)과 무관해진다.
      properties:
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
        max.block.ms: 5000

topics:
  transfers: banking.transfers
  ledger: banking.ledger

outbox:
  relay:
    enabled: true

ledger:
  reconciliation:
    interval-ms: ${LEDGER_RECONCILIATION_INTERVAL_MS:600000}

management:
  health:
    kafka:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # /actuator/health/liveness 는 livenessState 만 본다. 기본 /actuator/health 는
      # DataSource 인디케이터를 타므로 Hikari 풀이 마르면 probe timeout(3s)을 넘고,
      # liveness 가 거기 걸려 있으면 DB 경합이 곧 SIGKILL 이 된다. readiness 는 DB 를
      # 계속 본다 — 커넥션을 못 얻는 파드는 트래픽에서 빠지는 것이 맞다.
      probes:
        enabled: true
