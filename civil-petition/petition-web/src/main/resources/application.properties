spring.application.name=petition
spring.main.banner-mode=off
# 데이터소스는 Tomcat 의 JNDI 자원(conf/Catalina/localhost/petition.xml)이다.
spring.datasource.jndi-name=java:comp/env/jdbc/petitionDS
spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=30m
# 보관 배치(BatchService archive, 설계 docs/spec-testbed-vm-3tier.md §2-3 데이터 크기). 기본값의 정본이 아래 다섯 줄이고
# Tomcat 의 환경변수(PETITION_ARCHIVE_KEEP_ROWS, PETITION_ARCHIVE_CHUNK_ROWS, PETITION_ARCHIVE_PAUSE_MS,
# PETITION_ARCHIVE_WINDOW, PETITION_ARCHIVE_ZONE)로 덮을 수 있다.
# 상한은 시드 크기(민원 200만)와 같게 두어 시드가 곧 정상 상태다. 창은 was02 타이머(02:20 KST)를 품는 야간 시간이다.
petition.archive.keep-rows=2000000
petition.archive.chunk-rows=1000
petition.archive.pause-ms=1000
petition.archive.window=02:00-05:00
petition.archive.zone=Asia/Seoul
