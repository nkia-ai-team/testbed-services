# 66 하이퍼바이저 실행기 배관 줄을 로컬 파일로 돌리고 처리를 멈춘다(설계 docs/spec-testbed-vm-3tier.md §6-2 "66 호스트", Q7a).
# 66 은 자기 syslog 전부를 관제 서버로 보낸다(/etc/rsyslog.d/60-lucida-forward.conf). 이 파일은 그보다 앞서 읽혀야 한다(05).
# 걸리는 줄:
#  1) 실행기 계정 이름이 낱말로 든 줄(sshd 접속, sudo 명령, pam, logind, 세션 scope 시작)
#  2) 실행기 uid 가 든 systemd, logind 줄(user-, <유닛>@, UID , uid=, /user/ 뒤)
#  3) 도우미 이름이 든 줄
#  4) 일시 가드 유닛(run-r 뒤 16진 32자) 줄
#  5) 러너 주소({{runner_addr}})가 든 sshd 줄. 접속 끊김 줄(Received disconnect, Disconnected from) 일부에는 계정 이름이 없다.
#     그래서 tb-ops 에서 66 으로 들어오는 다른 접속의 sshd 줄도 함께 돌린다(설계 §6-2 66 행에 적은 결정).
# sudo 줄은 거르지 않는다: 실행기 계정의 sudo 는 sudoers 의 !syslog, !pam_session 으로 줄 자체를 남기지 않는다.
# 거르지 못하는 것: 계정 이름 없이 세션 번호만 든 systemd, logind 줄(session-N.scope: Deactivated successfully, Removed session N).
# 104 의 root 접속이 같은 꼴을 늘 남기므로 평시 줄과 같은 모양이고, 러너가 66 연결을 하나 늘 열어 두면 다시 열 때만 생긴다.
# 꼴은 civil-petition/deploy/tools/pipeline_patterns.py 한 곳이 정하고 build.py 가 채운다(runbook 확인 명령도 같은 곳).
if re_match($msg, "{{account_re}}")
   or (($programname == "systemd" or $programname == "systemd-logind")
       and re_match($msg, "{{uid_re}}"))
   or re_match($msg, "t4-hv-exec")
   or re_match($msg, "{{run_r_re}}")
   or (re_match($programname, "^sshd") and re_match($msg, "(^|[^0-9.]){{runner_addr_re}}([^0-9]|\$)"))
then {
    action(type="omfile" file="/var/log/hvjobs.log")
    stop
}
