# PostgreSQL 서버 로그 설정. 이 테스트베드의 평시 속성이며 시나리오마다 바꾸지 않는다
# (설계 spec-testbed-vm-3tier.md §2-3, §13-9. 값과 근거의 정본은 이 파일 하나다).
# DPM 이 없으므로 DB 안 사건이 관제 서버에 닿는 길은 이 로그의 로그 감시 줄뿐이다.
#
# 로그 위치와 줄 머리는 Ubuntu postgresql-common 기본을 그대로 쓴다:
#   stderr 를 /var/log/postgresql/postgresql-16-main.log 로(logging_collector off),
#   log_line_prefix '%m [%p] %q%u@%d ', 회전은 패키지의 logrotate(주 단위, 10개).
# 아래는 기본에서 바꾼 값과 일부러 기본으로 둔 값이다.

# 1초 넘는 문장을 남긴다. 운영 DB 에서 가장 흔한 느린 질의 기준(1000ms)이다.
log_min_duration_statement = 1000

# 잠금 대기가 deadlock_timeout(기본 1초)을 넘으면 남긴다. 운영 점검 지침에서 흔히 켜는 값이다.
log_lock_waits = on

# 체크포인트 기록. PostgreSQL 15 부터 기본이 on 이다(기본 그대로임을 적어 둔다).
log_checkpoints = on

# 접속과 종료 기록. 공공기관 DB 는 접속 기록 보존(개인정보 접속기록 관리 관행)으로 켜는 경우가 많다고 본다(추정).
# 앱은 연결 풀을 써서 평시 줄 수가 적다.
log_connections = on
log_disconnections = on

# DDL 기록. 스키마 변경을 감사용으로 남기는 흔한 값(ddl)이다. 데이터 변경 문장(mod)과 전체(all)는 남기지 않는다.
log_statement = 'ddl'

# 임시 파일 기록, 자동 vacuum 기록은 기본값(임시 파일 -1, autovacuum 10분)을 그대로 둔다.
log_temp_files = -1
log_autovacuum_min_duration = 10min

# 메시지 언어는 기본(C, 영어)이다.
lc_messages = 'C'
