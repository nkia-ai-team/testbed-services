# PostgreSQL 서버 로그 설정. 이 테스트베드의 평시 속성이며 시나리오마다 바꾸지 않는다
# (설계 spec-testbed-vm-3tier.md §2-3, §13-9. 값과 근거의 정본은 이 파일 하나다. 검토 세션 Q20-3 답:
# 한 번 정하고 고정, 기본값에서 바꾸는 항목마다 출처, 기본보다 자세히 남기는 항목은 그 이유).
# DPM 이 없으므로 DB 안 사건이 관제 서버에 닿는 길은 이 로그의 로그 감시 줄뿐이다.
#
# 로그 위치와 줄 머리는 Ubuntu postgresql-common 기본을 그대로 쓴다:
#   stderr 를 /var/log/postgresql/postgresql-16-main.log 로(logging_collector off),
#   log_line_prefix '%m [%p] %q%u@%d ', 회전은 패키지의 logrotate(주 단위, 10개).
# 아래는 PostgreSQL 16 기본에서 바꾼 값(출처를 적음)과 일부러 기본으로 둔 값이다. 출처는 셋이다.
#   [CIS]    CIS PostgreSQL 16 Benchmark v1.1.0 Level 1 의 3.1 로깅 항목(감사 항목 목록과 본문:
#            https://www.tenable.com/audits/CIS_PostgreSQL_16_v1.1.0_L1_OS_Linux_PostgreSQLDB)
#   [GitLab] GitLab 문서 "Monitoring and logging setup for external databases" 의 권장 로깅 매개변수 표
#            (https://docs.gitlab.com/administration/postgresql/external_metrics/)
#   [pgBadger] pgBadger README 의 "POSTGRESQL CONFIGURATION" 절(https://github.com/darold/pgbadger)
# 세 출처가 권하지만 여기서 기본으로 둔 것(log_temp_files 0, log_autovacuum_min_duration 0,
# log_min_duration_statement 0, CIS 의 logging_collector 와 log_line_prefix 등)은 기본값이라 출처가 필요 없고,
# 로그 위치와 양을 고객 대다수의 패키지 기본에서 멀게 하지 않으려고 고르지 않았다.

# 1초 넘는 문장을 남긴다(기본 -1, 끔). 출처 [GitLab] "log_min_duration_statement 1000: log slow queries
# (slower than 1 second)". 기본보다 자세히 남기는 이유: 느린 질의 기록은 DB 운영 점검의 기본 근거이고,
# DPM 없는 고객이 DB 안 지연을 보는 거의 유일한 길이다. 0(모든 문장)은 운영 부하가 커서 쓰지 않는다.
log_min_duration_statement = 1000

# 잠금 대기가 deadlock_timeout(기본 1초)을 넘으면 남긴다(기본 off). 출처 [GitLab] "log_lock_waits on: log of
# processes holding locks for long periods, a common cause of poor query performance", [pgBadger] 같은 값.
# 기본보다 자세히 남기는 이유: 잠금 대기는 느린 질의의 흔한 원인이고, 1초를 넘는 대기만 남아 평시 줄은 거의 없다.
log_lock_waits = on

# 체크포인트 기록. PostgreSQL 15 부터 기본이 on 이다(바꾼 것이 아님을 적어 둔다).
log_checkpoints = on

# 접속과 종료 기록(기본 off). 출처 [CIS] 3.1.20 "Ensure 'log_connections' is enabled", 3.1.21 "Ensure
# 'log_disconnections' is enabled", [pgBadger] 같은 값. 기본보다 자세히 남기는 이유: CIS 본문대로 PostgreSQL 은
# 접속 시도를 따로 기록하지 않아 감사하려면 이 로그가 필요하고, 공공기관 DB 는 보안 점검에서 이 항목을 받는다.
# 앱은 연결 풀(Tomcat JDBC, 유휴 60초 정리)을 써서 평시 줄은 부하 곡선을 따라 풀이 늘고 줄 때 생긴다
# (24시간 줄 수는 T2 실측으로 적는다).
log_connections = on
log_disconnections = on

# DDL 기록(기본 none). 출처 [CIS] 3.1.25 "It is recommended this be set to ddl unless otherwise directed by
# your organization's logging policy", [GitLab] "log_statement ddl". 기본보다 자세히 남기는 이유: 스키마 변경의
# 감사 기록. 데이터 변경 문장(mod)과 전체(all)는 남기지 않는다.
log_statement = 'ddl'

# 임시 파일 기록, 자동 vacuum 기록은 기본값(임시 파일 -1, autovacuum 10분)을 그대로 둔다.
log_temp_files = -1
log_autovacuum_min_duration = 10min

# 메시지 언어는 영어(C)다. 이 클러스터는 C.UTF-8 로 만들어 initdb 가 적는 기본도 영어 메시지다. [pgBadger] 도
# 'C' 를 권한다(로그 분석 도구가 영어 문구를 읽는다).
lc_messages = 'C'
