# 라우터는 ICMP redirect 를 보내지 않는다(runbook §6-2).
# 커널은 all 과 NIC 값 중 하나라도 1 이면 redirect 를 보낸다. default 는 이 파일이 읽힌 뒤 생기는 NIC 몫이라
# 부팅 때 먼저 선 NIC 는 커널 기본값 1 을 가진다. 그래서 NIC 마다 끈다. 부팅 때 NIC 줄은 NIC 가 생길 때
# udev(99-systemd.rules 의 systemd-sysctl --prefix)가 이 파일에서 다시 읽는다. 적용 때는 router 단계가 바로 쓴다.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
{{ router_send_redirects }}
