# 계층 사이 라우터의 SNMP 에이전트(설계 §4 rt-core01). 커뮤니티 문자열은 snmpd.community.conf 에만 있다.
agentaddress udp:{{up_addr}}:161,udp:127.0.0.1:161
sysLocation {{snmp_location}}
sysContact {{snmp_contact}}
sysServices 72

includeFile /etc/snmp/snmpd.community.conf

# 링크 상태 바뀜 trap(linkDown, linkUp). DisMan 감시가 내부 질의에 쓰는 v3 사용자.
createUser internalUser
iquerySecName internalUser
rouser internalUser noauth
linkUpDownNotifications yes

# 가상 NIC 는 속도가 정해져 있지 않아 실제 장비처럼 속도를 고정해 보고한다(GT0 결정 9).
{{snmp_interface_lines}}

# ifOutDiscards 열: 커널 송신 버림 + 큐 계열 qdisc 의 넘침 버림(GT0 결정 4, 설계 §5).
pass_persist .1.3.6.1.2.1.2.2.1.19 /usr/bin/python3 /usr/local/lib/ifdiscards/ifdiscards.py --config /etc/snmp/ifdiscards.json

# lldpd 가 AgentX 하위 에이전트로 붙는다.
master agentx
