# 민원 포털 앞단(설계 §2-3 웹). 정적 파일을 내고 업무 경로는 WAS 두 대에 고정 세션으로 나눈다.
<VirtualHost *:{{web_port}}>
	ServerName {{hostname}}
	DocumentRoot /var/www/petition
	<Directory /var/www/petition>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>

	<Proxy "balancer://wascluster">
{{balancer_members}}
		ProxySet stickysession=JSESSIONID|jsessionid lbmethod=byrequests
	</Proxy>
	ProxyPreserveHost On
	ProxyPass        "/{{app_context}}/" "balancer://wascluster/{{app_context}}/" timeout=30
	ProxyPassReverse "/{{app_context}}/" "balancer://wascluster/{{app_context}}/"

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
