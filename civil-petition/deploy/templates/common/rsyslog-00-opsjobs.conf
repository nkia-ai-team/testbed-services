# 실행기 배관 줄을 로컬 파일로 돌리고 처리를 멈춘다(설계 spec-testbed-vm-3tier.md §6-2, Q7a).
# 파일 쓰기(50-default.conf)와 원격 전달(rsyslog.conf 끝)보다 앞서야 하므로 00 으로 둔다.
# 걸리는 줄:
#  1) 실행기 계정의 프로세스가 직접 남긴 줄(사용자 systemd 인스턴스 포함), 소켓 자격 증명의 uid 로 가른다
#  2) auth, authpriv 줄 가운데 실행기 계정 이름이 낱말로 든 줄(sshd 접속, sudo 명령, pam 세션)
#  3) systemd, systemd-logind 줄 가운데 계정 이름이나 uid(user@, user-, UID, uid=, /user/ 꼴)가 든 줄
#  4) 일시 가드 유닛(run-r 뒤 16진 32자) 줄
# 운영자 계정은 이름과 uid 가 달라 걸리지 않는다(원인 흔적이라 막지 않는다).
if ($!uid == "{{executor_uid}}")
   or (($syslogfacility-text == "auth" or $syslogfacility-text == "authpriv")
       and re_match($msg, "(^|[^[:alnum:]_.-]){{executor_name}}([^[:alnum:]_-]|$)"))
   or (($programname == "systemd" or $programname == "systemd-logind")
       and (re_match($msg, "(^|[^[:alnum:]_.-]){{executor_name}}([^[:alnum:]_-]|$)")
            or re_match($msg, "(user[@-]|UID |uid=|/user/){{executor_uid}}([^0-9]|$)")))
   or re_match($msg, "run-r[0-9a-f]{32}")
then {
    action(type="omfile" file="/var/log/opsjobs.log")
    stop
}
