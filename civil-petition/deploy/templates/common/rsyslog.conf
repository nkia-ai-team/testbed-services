# Ubuntu 24.04 기본 /etc/rsyslog.conf 와 같고, 로컬 소켓의 보낸 프로세스 uid 를 속성($!uid)으로 읽는 설정
# (SysSock.Annotate, SysSock.ParseTrusted)과 맨 끝의 원격 전달 포함 한 줄만 다르다. uid 속성은
# /etc/rsyslog.d/00-opsjobs.conf 가 실행기 계정의 사용자 systemd 줄을 거르는 데 쓴다(설계 §6-2).
# ParseTrusted 를 켜면 uid 는 메시지 본문이 아니라 속성에만 들어간다(본문은 그대로).

module(load="imuxsock" SysSock.Annotate="on" SysSock.ParseTrusted="on")
module(load="imklog" permitnonkernelfacility="on")

$RepeatedMsgReduction on

$FileOwner syslog
$FileGroup adm
$FileCreateMode 0640
$DirCreateMode 0755
$Umask 0022
$PrivDropToUser syslog
$PrivDropToGroup syslog

$WorkDirectory /var/spool/rsyslog

$IncludeConfig /etc/rsyslog.d/*.conf

# 원격 전달은 모든 로컬 규칙(실행기 줄 거르기, 패키지가 둔 tomcat10.conf 의 stop 포함) 뒤에 둔다.
# 전달하지 않는 서버에는 이 디렉터리가 비어 있다.
include(file="/etc/rsyslog.remote.d/*.conf" mode="optional")
