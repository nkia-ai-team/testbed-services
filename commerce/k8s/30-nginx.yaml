# ============================================================
# Nginx Reverse Proxy — 외부 요청의 유일한 입구
# ============================================================
# 외부에서 <노드 IP>:30080 (상주 부하는 tb-cp 192.168.122.77:30080) 으로 요청하면:
#   NodePort(30080) → Nginx(:80) → order-service(:8080)
#
# Nginx 설정은 02-configmaps.yaml의 nginx-conf ConfigMap에 있다.
# 그 ConfigMap을 /etc/nginx/conf.d/ 폴더에 파일로 마운트한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testbed-nginx
  namespace: rca-testbed-commerce
  labels:
    app: testbed-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testbed-nginx
  template:
    metadata:
      labels:
        app: testbed-nginx
    spec:
      # 진입 nginx 는 DB 노드가 아닌 제어 노드에 둔다(testbed v4 E8). commerce PostgreSQL 이 도는 tb-w1 에 노드 메모리
      # 압박이나 정지를 넣으면 요청이 작은 nginx 가 커널 OOM 과 축출 순서 앞쪽이라 먼저 죽어 진입이
      # 연결 불가(0)가 되고 원인이 흐려졌다(runbook §8-7, create-runs 10-16 F81-R). 러너의 노드 주입
      # 대상은 워커뿐이라 제어 노드의 진입은 주입을 받지 않고, 하류가 죽으면 502 로 답한다.
      nodeSelector:
        kubernetes.io/hostname: tb-cp
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nginx
          # 노드를 옮겨도 판이 바뀌지 않게 옮기기 전 tb-w1 에서 돌던 이미지(nginx 1.31.3)를 다이제스트로 고정한다.
          image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          ports:
            - containerPort: 80
          # ConfigMap "nginx-conf"를 /etc/nginx/conf.d/ 폴더에 마운트.
          # ConfigMap에 있는 "default.conf" 키가 이 폴더 안에 파일로 생성된다.
          # → /etc/nginx/conf.d/default.conf
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: nginx-conf          # 02-configmaps.yaml에서 만든 ConfigMap
---
# ============================================================
# Nginx Service (NodePort) — 외부 접근 포트
# ============================================================
# 이게 전체 시스템의 정문이다.
# 외부에서 <노드 IP>:30080 으로 요청하면 이 Service가 받아서
# Nginx Pod의 80번 포트로 전달한다.
apiVersion: v1
kind: Service
metadata:
  name: testbed-nginx-external
  namespace: rca-testbed-commerce
spec:
  type: NodePort
  selector:
    app: testbed-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080                  # 외부 접근 포트
