apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: rca-testbed-commerce
type: Opaque
stringData:
  POSTGRES_DB: commerce
  POSTGRES_USER: commerce
  POSTGRES_PASSWORD: commerce1234
  # DPM 모니터링 계정(조회 전용). lucida-next 의 collector-dpm 이 이 이름·비밀번호로
  # 접속하므로 값을 바꾸면 대상 등록(collectors.config_encrypted)도 함께 갱신해야 한다.
  # 정본은 여기 한 곳 — db/monitoring.sql.tmpl 은 값을 갖지 않고 배포 시 치환된다.
  MON_USER: lucida_mon
  MON_PASSWORD: lucida_mon1234
