server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/commerce
    username: ${DB_USER:commerce}
    password: ${DB_PASS:commerce1234}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: payment_schema
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  health:
    kafka:
      enabled: false

outbox:
  relay:
    enabled: true

topics:
  payments: commerce.payments

pg:
  api:
    # 기본값도 이름이다. 옛 기본값은 109 호스트 mock 의 IP 리터럴이라, env 가 빠지면 DNS 를
    # 거치지 않는 호출이 됐다(spec-scenario-design §9.3 G15). 정본은 configmap PG_API_URL.
    base-url: ${PG_API_URL:http://testbed-external-pg-mock:9090}
    connect-timeout: 3s
    read-timeout: 10s

services:
  banking-transfer:
    base-url: ${BANKING_TRANSFER_URL:http://testbed-transfer.rca-testbed-banking.svc.cluster.local:8082}
    connect-timeout: 3s
    read-timeout: 10s
