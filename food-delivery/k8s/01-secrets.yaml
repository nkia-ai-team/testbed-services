apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: rca-testbed-food
type: Opaque
stringData:
  # MySQL 컨테이너 초기화용 (envFrom 으로 mysql:8.0 에 주입 → DB/유저 자동 생성)
  MYSQL_DATABASE: fooddelivery
  MYSQL_USER: fooddelivery
  MYSQL_PASSWORD: fooddelivery1234
  MYSQL_ROOT_PASSWORD: rootpassword1234
  # DPM 모니터링 계정(조회 전용). lucida-next 의 collector-dpm 이 이 이름·비밀번호로
  # 접속하므로 값을 바꾸면 대상 등록(collectors.config_encrypted)도 함께 갱신해야 한다.
  # 정본은 여기 한 곳 — db/monitoring.sql.tmpl 은 값을 갖지 않고 배포 시 치환된다.
  MON_USER: lucida_mon
  MON_PASSWORD: lucida_mon1234
