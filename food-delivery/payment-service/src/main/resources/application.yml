server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fooddelivery}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:fooddelivery}
    password: ${DB_PASSWORD:fooddelivery1234}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8080}
    connect-timeout: 3s
    read-timeout: 10s

pg:
  api:
    base-url: ${PG_API_URL:http://localhost:9090}
    connect-timeout: 3s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: false

outbox:
  relay:
    enabled: true

topics:
  payments: food.payments

# order(reverse lookup)·pg(외부 PG mock) 호출 전부 timeout+retry+circuit breaker.
# pg는 결제성 호출이라 max-attempts=2.
resilience4j:
  circuitbreaker:
    instances:
      order:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.fooddelivery.common.exception.ClientErrorException
      pg:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.fooddelivery.common.exception.ClientErrorException
  retry:
    instances:
      order:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.fooddelivery.common.exception.ClientErrorException
      pg:
        max-attempts: 2
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.fooddelivery.common.exception.ClientErrorException

settlement:
  poll-interval-ms: 3600000

payment:
  # 보존 기간이 지난 끝난 결제(FAILED, 정산 완료 승인)를 주기마다 batch-size 건씩 지운다(PaymentRetentionBatch).
  # 분당 상한 = batch-size × 60000 / interval-ms (기본 2만 건). 주문·배차·결제 셋이 같은 기간을 쓴다
  # (order·dispatch·payment.retention) — 기간을 바꾸면 셋을 함께 바꾼다.
  retention:
    enabled: ${PAYMENT_RETENTION_ENABLED:true}
    days: ${PAYMENT_RETENTION_DAYS:30}
    interval-ms: ${PAYMENT_RETENTION_INTERVAL_MS:6000}
    batch-size: ${PAYMENT_RETENTION_BATCH_SIZE:2000}
