              "_note": "새 api 버전이 이체 접수와 거래 내역 조회마다 스레드 하나짜리 풀(Executors.newFixedThreadPool(1))을 만들어 하류 호출을 맡기고 닫지 않아, 요청 하나마다 멈춘 비데몬 스레드가 하나씩 남는다. 동반 부하에서 api 로 오는 요청이 초당 약 11건(이체 11, 동반 부하에는 거래 내역 단계가 없다)이면 스레드가 초당 약 11개, 컨테이너 메모리가 스레드당 약 100~130KiB(스레드 스택 접근 페이지 + 커널 스택 16KiB) 늘어 평시 약 290MiB 에서 한도 1GiB 까지 약 8~11분이다. 한도에 닿으면 회수할 파일 페이지가 거의 없어(운영 api cgroup file 160KiB) 짧게 느려지다 커널이 컨테이너 안 java 를 OOM 으로 죽이고, 걸려 있던 이체와 재기동(첫 크래시는 kubelet 이 바로 재시작, 109 실측 기동에서 Ready 까지 26~29초) 동안의 이체가 nginx 502 다. 비율은 이체 완료 시각 기준 30초 창이라 0.5 이상인 구간은 엔드포인트 복귀 + 15초까지이고, 길이는 멈춤 중 걸린 요청이 한꺼번에 502 가 되는 길이에 따라 약 30~45초다. 새 컨테이너도 같은 버전이라 되풀이한다. 운영 실측(F63-R-run-81153e98, api 요청률이 같은 20rps 동반 부하): 비데몬 스레드 초당 약 12.3개(4 → 5,883), 새 파드 Ready(09:46:26) 뒤 7분 55초에 첫 memcg OOM, OOM 앞 readiness, liveness 시간 초과 없음, OOM 보고의 kernel_stack 약 95MiB"
