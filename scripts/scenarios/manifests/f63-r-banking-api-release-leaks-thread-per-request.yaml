          "_note": "consecutive_ticks 1(선례 F20-R). 러너는 틱을 끝낸 뒤 15초를 쉬어 실제 틱 간격이 15~25초(109 ticks.jsonl 평균 약 18초)이고, 이 관측은 갱신 30초라 2틱이 서려면 첫 참 틱과 약 38초 뒤의 참 틱이 모두 실패 구간 안에 들어야 한다(평가 시뮬레이션: 참 구간 43초면 33%, 30초면 0%). 1틱 근거: ① 비율 ≥0.5 인 구간은 [OOM 순간 − (걸린 요청이 한꺼번에 502 가 되는 길이 − 15초), 엔드포인트 복귀 + 15초] 라 엔드포인트 복귀까지 약 28~31초(109 KCM Started → 옛 파드 Killing 26~29초 + 재기동 1~2초)만으로도 L ≥ 28초이고, 최대 틱 간격 25초보다 길어 어느 위상이든 한 틱은 든다. ② 30초 창 하나가 동반 부하 이체 약 330건(11건/초 × 30초)의 집계라 표본 한 개짜리 잡음이 아니다. 평시 이 비율은 0 이다. ③ min_hold 9m 이 롤아웃 직후 과도 구간(새 파드 기동, 동반 부하 ramp)을 막는다. 주기: 롤아웃 뒤 새 파드 Ready 약 30초(109 KCM 2026-10-09 testbed-api Started 13:52:27 → 옛 파드 Killing 13:52:56, 다른 롤아웃 Started 14:07:41 → Ready 14:08:07), 동반 부하 ramp 2m 동안은 누수가 느리고, 그 뒤 초당 약 11개씩 쌓여 한도까지 약 8~9분(스레드 RSS 97~130KiB 면 OOM 이 롤아웃 뒤 약 9.7~12.8분), 짧은 멈춤 뒤 OOM, 재기동 약 30초가 한 주기다. kubelet 은 앞 크래시 뒤 10분(2 × 최대 대기 5분)을 넘겨야 재시작 대기를 초기화하므로, 주기가 10분보다 짧으면 두 번째 크래시는 10초 대기를 받는다(실패 구간이 늘어 판정엔 유리).  첫 실패 구간이 약 10~11분, 두 번째가 약 20~22분이라 min_hold 9m 이면 두 구간이 모두 판정 기회다. 첫 구간에서 판정되면 녹화 구간에는 되풀이가 한 번(누수 → OOM → 재시작 → 다시 상승)만 들어간다. (2026-10-11 로컬 실측: 같은 패치 jar, eclipse-temurin 17-jre, OTel 에이전트, 0.5 CPU, 1GiB, 하류 흉내 서버, 11건/초: 기동 직후 287MiB, 8분 20초에 스레드 5,544개 1,016MiB, 그 뒤 약 80초 만에 OOMKilled(137). 마지막 약 30초만 응답이 0.2초에서 최장 22.9초로 늘고, 죽기 전까지 오류는 없었다). timeout 28m 은 운영(aarch64, 내보내기 켬)에서 스레드당 메모리나 요청률이 달라 주기가 늘어도 두 번째 구간을 받는다"
