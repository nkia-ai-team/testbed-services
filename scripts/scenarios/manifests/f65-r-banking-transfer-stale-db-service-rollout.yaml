{
  "schema_version": "1.0",
  "id": "F65-R",
  "slug": "f65-r-banking-transfer-stale-db-service-rollout",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "banking namespace",
    "matrix_location_transport": "K/kubectl banking testbed-transfer 컨테이너 env 배열 교체(기준 배열 + DB_SERVICE=XEPDB1) + R/ssh load.north_south companion(core-banking transfer-heavy-surge.js, target_rps=5)",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/k8s.env",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "kubernetes-original-env-snapshot",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "k8s.env",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "k8s.env"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "25m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f65-r",
              "parameters": {
                "namespace": "rca-testbed-banking",
                "deployment": "testbed-transfer",
                "container": "transfer-service",
                "baseline": [
                  {
                    "name": "DB_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "APP_USER",
                        "name": "oracle-secret"
                      }
                    }
                  },
                  {
                    "name": "DB_PASS",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "APP_USER_PASSWORD",
                        "name": "oracle-secret"
                      }
                    }
                  },
                  {
                    "name": "JAVA_TOOL_OPTIONS",
                    "value": "-javaagent:/opt/apm/opentelemetry-javaagent.jar -Xmx512m"
                  },
                  {
                    "name": "OTEL_SERVICE_NAME",
                    "value": "core-banking-transfer"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://192.168.122.20:14318"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_PROTOCOL",
                    "value": "grpc"
                  },
                  {
                    "name": "OTEL_RESOURCE_ATTRIBUTES",
                    "value": "lucida.groupId=core-banking,lucida.target_id=f0ce5940-a7e2-44a2-843f-196de379d898"
                  },
                  {
                    "name": "OTEL_TRACES_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRICS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_LOGS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRIC_EXPORT_INTERVAL",
                    "value": "10000"
                  }
                ],
                "fault": [
                  {
                    "name": "DB_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "APP_USER",
                        "name": "oracle-secret"
                      }
                    }
                  },
                  {
                    "name": "DB_PASS",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "APP_USER_PASSWORD",
                        "name": "oracle-secret"
                      }
                    }
                  },
                  {
                    "name": "DB_SERVICE",
                    "value": "XEPDB1"
                  },
                  {
                    "name": "JAVA_TOOL_OPTIONS",
                    "value": "-javaagent:/opt/apm/opentelemetry-javaagent.jar -Xmx512m"
                  },
                  {
                    "name": "OTEL_SERVICE_NAME",
                    "value": "core-banking-transfer"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://192.168.122.20:14318"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_PROTOCOL",
                    "value": "grpc"
                  },
                  {
                    "name": "OTEL_RESOURCE_ATTRIBUTES",
                    "value": "lucida.groupId=core-banking,lucida.target_id=f0ce5940-a7e2-44a2-843f-196de379d898"
                  },
                  {
                    "name": "OTEL_TRACES_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRICS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_LOGS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRIC_EXPORT_INTERVAL",
                    "value": "10000"
                  }
                ]
              },
              "min_hold": "15m",
              "settle": "60s",
              "timeout": "20m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "기준선 문서의 이체 단계(nginx → api) 상태. 고장 중 nginx, api, account 는 살아서 502 로 답하므로 0(연결 불가)은 nginx 나 노드가 죽었을 때만 나온다",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s",
            "_note": "러너 고정 대상(commerce 진입점 30080/health)이라 banking 고장과 무관하다. compile-plan 이 recovery 에 target_health==200 을 요구해서 둔다. 판정력은 없다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-transfer"
            },
            "_note": "transfer 파드. 롤아웃이 옛 파드를 먼저 내리고(maxSurge 0) 새 파드는 컨테이너가 떠도 DB 연결 서비스 이름이 낡아(XEPDB1) /actuator/health 의 db 가 DOWN(503)이라 고장 내내 false 다. 기동 프로브 60회(300초) 실패마다 kubelet 이 컨테이너를 다시 띄워도 같다. 성공 조건에는 쓰지 않는다. cleanup 이 env 를 되돌리면 새 파드가 Ready 가 되어 true(회복 조건)",
            "freshness": "30s"
          },
          {
            "id": "transfer_available_replicas",
            "adapter": "kubernetes",
            "query_id": "kubernetes.deployment_available_replicas",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "deployment": "testbed-transfer"
            },
            "_note": "고장 중 0, 회복 뒤 1",
            "freshness": "30s"
          },
          {
            "id": "balance_read_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "_note": "동반 부하(core-banking transfer-heavy-surge.js 5rps)의 잔액 조회(step get, 35%, nginx → account 직행) 실패율. account 는 transfer 를 부르지 않고 같은 Oracle 의 FREEPDB1 로 답하므로 고장 중에도 0 이어야 한다",
            "freshness": "30s"
          },
          {
            "id": "transfer_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "_note": "동반 부하의 이체(step transfer, 40%, nginx → api → account → transfer) 5xx 비율. 질의 이름은 food 지만 선택자는 도메인 공통 business.5xx.rate 다. 평시 업무 거절은 400(잔액 부족)이라 5xx 는 0. 고장 중 transfer 엔드포인트가 비어 account 의 transfer 호출이 Connection refused 로 끝나 502",
            "freshness": "30s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "transfer_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "상주 기준선(loadgen-banking)의 이체(step transfer, 10%) 5xx 비율. 평시 0, 고장 중 약 1.0. 30초 창에 이체가 없으면 필드가 빠져 unusable 이 될 뿐 통과로 읽히지 않는다. 동반 부하가 끝난 뒤의 회복 판정에 쓴다",
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "transfers-failing-5xx",
              "observation": "transfer_5xx_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "transfer 엔드포인트가 비어(새 파드가 DB 에 붙지 못해 NotReady) account 의 이체 호출이 Connection refused, 재시도, 서킷 열림 끝에 502 이고 api 도 502 로 답한다. core-banking-account, core-banking-api 서버 스팬이 ERROR 가 되어 골든 시그널 오류율을 올린다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 15m: 패치 직후 옛 파드가 내려가(maxSurge 0) 실패가 약 15분 이어진 다음 판정된다. 새 파드는 약 30초 뒤 앱이 떠서 ORA-12514 를 남기지만 Ready 가 되지 않는다. banking 선례(F17-H)는 promote 지연이 약 18~20분이다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1.25,
              "_note": "동반 부하 5rps 의 1/4. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "account-path-failing",
              "observation": "balance_read_nonok_rate",
              "op": "gte",
              "value": 0.2,
              "_note": "nginx → account 직행 잔액 조회까지 실패하면 transfer 의 연결 설정이 아니라 account 자체나 Oracle 쪽 장애(F35-R 계정 잠금, Oracle 중단)다. 이 주입은 transfer 의 env 한 줄만 바꾸고 Oracle 과 다른 서비스의 연결 설정은 그대로다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "transfer-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "transfer-replica-recovered",
              "observation": "transfer_available_replicas",
              "op": "eq",
              "value": 1
            },
            {
              "id": "baseline-transfers-recovered",
              "observation": "transfer_5xx_rate_baseline",
              "op": "lt",
              "value": 0.05,
              "_note": "평시 0.0, 고장 중 약 1.0. 30초 창 이체 약 3건이라 5xx 가 한 건만 있어도 0.25 이상이 되어 통과하지 못한다"
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 env 배열을 되돌리면 다시 롤아웃되어(maxSurge 0) DB_SERVICE 가 없는 새 파드가 공용 ConfigMap 의 FREEPDB1 로 붙어(JVM 기동 약 30~45초) Ready 가 되고, 기준선 이체가 30초 창 두 번 연속 5xx 없이 끝나야 회복이다. target_health 는 compile-plan 이 요구하는 형식 조건이라 판정력이 없다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
