            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 표가 읽기 전용이면 READ WRITE 로 돌리고 START WITH LIMIT VALUE 로 생성기를 표의 최대 키 다음으로 보내면 transfer 의 다음 INSERT 가 새 키를 받아 성공한다(로컬 실측 되돌린 뒤 모두 200). 재시작이나 재배포가 필요 없다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
