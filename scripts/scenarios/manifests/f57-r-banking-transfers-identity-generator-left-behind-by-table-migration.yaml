              "_note": "동반 부하 5rps 의 1/4. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "account-path-failing",
              "observation": "balance_read_nonok_rate",
              "op": "gte",
              "value": 0.2,
              "_note": "nginx → account 직행 잔액 조회까지 실패하면 이체 표의 생성기가 아니라 account 나 Oracle 전체(F35-R 계정 잠금, F25-H 꼴) 장애다"
            },
            {
              "id": "banking-db-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "Oracle 파드가 빠지면 생성기가 아니라 DB 다운이다"
            },
            {
              "id": "transfer-pod-gone",
              "observation": "transfer_pod_ready",
              "op": "eq",
              "value": false,
              "_note": "transfer 파드가 빠지면 생성기가 아니라 transfer 자체가 빠진 장애(F17-H, F52-R 꼴)다"
            },
            {
              "id": "transfer-crashloop-alternative",
              "observation": "transfer_restart_count",
              "op": "gte",
              "value": 2,
              "_note": "생성기 되감기는 재시작을 일으키지 않는다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "db-ready",
              "observation": "pod_ready",
              "op": "eq",
