{
  "schema_version": "1.0",
  "id": "F07-H",
  "slug": "f07-h-north-south-surge",
  "readiness": "ready",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "load.north_south",
        "companion_refs": []
      },
      "runtime": {
        "mode": "calibration",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "40m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "adaptive_ladder",
          "levels": [
            {
              "id": "healthy-high-120",
              "parameters": {
                "target_rps": 120,
                "ramp_up": "2m",
                "hold": "525s",
                "ramp_down": "15s",
                "entry_url": "http://192.168.122.77:30080",
                "script_path": "/opt/loadgen/commerce/surge.js",
                "scenario_tag": "scenario_id=F07-H",
                "seed": 4242,
                "baseline_unit": "loadgen-commerce"
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "11m"
            },
            {
              "id": "knee-140",
              "parameters": {
                "target_rps": 140,
                "ramp_up": "2m",
                "hold": "525s",
                "ramp_down": "15s",
                "entry_url": "http://192.168.122.77:30080",
                "script_path": "/opt/loadgen/commerce/surge.js",
                "scenario_tag": "scenario_id=F07-H",
                "seed": 4242,
                "baseline_unit": "loadgen-commerce"
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "11m"
            },
            {
              "id": "overload-160",
              "parameters": {
                "target_rps": 160,
                "ramp_up": "2m",
                "hold": "525s",
                "ramp_down": "15s",
                "entry_url": "http://192.168.122.77:30080",
                "script_path": "/opt/loadgen/commerce/surge.js",
                "scenario_tag": "scenario_id=F07-H",
                "seed": 4242,
                "baseline_unit": "loadgen-commerce"
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "11m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "parameters": {
              "domain": "commerce"
            },
            "_note": "2026-08-10: domain 추가. http.entry_health 는 adapter 이름과 달리 HTTP 를 치지 않고 시나리오 자신의 k6 live 문서를 읽는다. load.north_south 가 primary 인 5종(F07-H·F11-R·F17-P·F20-Q·F20-R)은 레벨 전환이 곧 부하 재시작이라, 레벨 타임아웃 판정 시각과 부하 종료 시각이 정확히 겹친다(ramp+hold+ramp == timeout, 여유 0). 그 한 틱에서 entry_status 가 unusable 이 되면 adaptive.py:234 의 safety_unknown 이 서고 success·escalate 가 **둘 다** 막힌 채 :282 에서 safety_observation_unavailable 로 abort 한다. 실측: F20-R 은 정상 에스컬레이션 5회 대 좌초 100회(성공률 4.8%), F07-H 는 타임아웃 도달 8회 중 8회 unusable. domain 을 주면 상주 baseline 문서를 읽으므로 시나리오 부하와 무관해진다. abort 는 entry_status==0(도달 불가)이라 도메인 수준 신호로 읽어도 의미 손실이 없다."
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "freshness": "30s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "user_p95",
            "adapter": "prometheus",
            "query_id": "prometheus.apm_service_p95",
            "parameters": {
              "service_name": "commerce-gateway"
            },
            "freshness": "120s"
          },
          {
            "id": "blocked_inventory_sessions",
            "adapter": "database",
            "query_id": "database.blocked_session_count",
            "parameters": {
              "schema": "inventory_schema",
              "table": "inventory"
            },
            "freshness": "30s"
          },
          {
            "id": "blocked_payment_sessions",
            "adapter": "database",
            "query_id": "database.blocked_session_count",
            "parameters": {
              "schema": "payment_schema",
              "table": "payments"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "latency-elevated",
              "observation": "user_p95",
              "op": "gte",
              "value": 500
            }
          ],
          "consecutive_ticks": 2
        },
        "escalate": {
          "all": [
            {
              "id": "surge-delivered",
              "observation": "achieved_rps",
              "op": "gte",
              "value": 100
            },
            {
              "id": "latency-not-elevated",
              "observation": "user_p95",
              "op": "lt",
              "value": 500
            }
          ],
          "consecutive_ticks": 3
        },
        "must_rule_out": {
          "any": [
            {
              "id": "db-lock-alternative-inventory",
              "observation": "blocked_inventory_sessions",
              "op": "gt",
              "value": 0
            },
            {
              "id": "db-lock-alternative-payment",
              "observation": "blocked_payment_sessions",
              "op": "gt",
              "value": 0
            },
            {
              "id": "surge-not-achieved",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 100
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
