{
  "schema_version": "1.0",
  "id": "F56-R",
  "slug": "f56-r-banking-partner-settlement-accounts-deleted-by-purge-with-wrong-ids",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh db.row_delete banking testbed-oracle-0 CREATE TABLE BANKING.ACCOUNTS_PURGE_ARCHIVE AS SELECT … WHERE 1 = 0, 한 트랜잭션에서 SELECT … FOR UPDATE, INSERT INTO 보관 표 SELECT, DELETE FROM BANKING.ACCOUNTS WHERE ID IN ('commerce-merchant','commerce-settlement'), COMMIT(kubectl exec sqlplus / as sysdba, PDB FREEPDB1, preflight 가 두 id 있음과 보관 표 없음을 확인) + R/ssh load.north_south companion(commerce surge.js, target_rps=3)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.row_delete",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "db-inverse-ddl-ready",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "db.row_delete",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "db.row_delete"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "25m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f56-r",
              "parameters": {
                "engine": "oracle",
                "namespace": "rca-testbed-banking",
                "pod": "testbed-oracle-0",
                "schema": "BANKING",
                "table": "ACCOUNTS",
                "key_column": "ID",
                "keys": [
                  "commerce-merchant",
                  "commerce-settlement"
                ],
                "archive_table": "ACCOUNTS_PURGE_ARCHIVE"
              },
              "min_hold": "15m",
              "settle": "30s",
              "timeout": "20m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "_note": "commerce 진입점(nginx → gateway) 상태. 주입은 banking Oracle 의 계좌 행 두 개만 지우고 commerce 진입 경로와 무관하다. checkout 이 502 여도 nginx, gateway 는 상품 목록에 200 으로 답하므로 0(연결 불가)은 nginx 나 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-transfer"
            },
            "freshness": "30s",
            "_note": "banking transfer 파드. 계좌 행이 없어도 transfer 는 Ready 이고 banking 자신의 이체에 계속 답해야 한다. 빠지면 계좌 행 삭제가 아니라 transfer 다운(F17-R, F17-H, F50-R, F52-R 꼴)이다"
          },
          {
            "id": "payment_pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-payment"
            },
            "freshness": "30s",
            "_note": "commerce payment 파드. 정산 이체를 부르는 쪽이다. 빠지면 결제 서비스 자체 장애다. 이 주입은 payment 를 건드리지 않는다"
          },
          {
            "id": "postgres_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s"
          },
          {
            "id": "oracle_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-oracle"
            },
            "freshness": "30s",
            "_note": "banking Oracle 파드. 주입은 행 두 개를 지우는 문장 하나이고 Oracle 을 멈추지 않는다. 빠지면 F25-H 꼴 DB 중단이다"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s",
            "_note": "동반 부하(commerce surge.js 3rps, 여정의 50% 가 checkout)의 k6 live 문서. checkout 은 order → payment → (외부 결제 mock 뒤) core-banking transfer 정산 이체(commerce-settlement → commerce-merchant)를 동기로 부른다. 두 계좌 행이 지워진 뒤 transfer 의 execute 가 작은 id 인 commerce-merchant 를 FOR UPDATE 로 찾다 없어 즉시 400 'Account not found: commerce-merchant' 로 답하고, payment 의 BankingTransferClient 가 RestClientException 을 502 'core-banking transfer call failed: 400 ...' 로 바꾸며, order 는 결제 재시도 2회 뒤 서킷이 열리고 checkout 502. 연결, 시간 초과가 아니라 응답을 받은 즉시 실패라 지운 순간부터 checkout 성공은 0 이다"
          },
          {
            "id": "checkout_2xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "freshness": "30s"
          },
          {
            "id": "balance_read_nonok_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "core-banking"
            },
            "freshness": "30s",
            "_note": "상주 기준선(loadgen-banking)의 잔액 조회(nginx → account, 55%) 실패율. banking 손님 계좌(ACC-*)는 지워지지 않아 고장 중에도 0 이어야 한다. 30초 창에 약 15~30건"
          },
          {
            "id": "checkout_nonok_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.write_step_status_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "checkout-failed-5xx",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.5
            },
            {
              "id": "checkout-collapsed",
              "observation": "checkout_2xx_rate",
              "op": "lt",
              "value": 0.3
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 15m. 행을 지운 커밋 직후부터 정산 이체는 transfer 가 응답을 받자마자 400 으로 거절하므로 지연 없이 실패한다. payment 의 banking 호출에는 재시도와 서킷이 없어 checkout 마다 502 이고, order 의 paymentClient 는 2회 시도 뒤 서킷(10회 중 50%, 5초 열림)이 열려 열린 동안의 checkout 은 fallback 502 다. 행이 돌아오기 전 checkout 성공은 0 이다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1,
              "_note": "동반 부하 3rps 의 1/3. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "transfer-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "transfer 파드가 빠지면 연결 거부(엔드포인트 없음)로 정산이 실패하는 F17-R, F17-H 꼴이다. 이 주입에서 transfer 는 Ready 이고 banking 자신의 이체, 내역 조회에 계속 답한다"
            },
            {
              "id": "payment-down",
              "observation": "payment_pod_ready",
              "op": "eq",
              "value": false,
              "_note": "commerce payment 가 빠지면 결제 서비스 자체 장애(F05-R, F05-H 꼴)다"
            },
            {
              "id": "commerce-db-down",
              "observation": "postgres_ready",
              "op": "eq",
              "value": false,
              "_note": "PostgreSQL 이 빠지면 F25-H 꼴이다"
            },
            {
              "id": "banking-own-path-failing",
              "observation": "balance_read_nonok_rate_baseline",
              "op": "gte",
              "value": 0.2,
              "_note": "banking 자신의 잔액 조회까지 실패하면 계좌 행 두 개의 삭제가 아니라 banking 쪽 넓은 장애(F35-R 의 Oracle 계정, F35-H 의 표 소실, F51-R 의 account 소실 꼴)다"
            },
            {
              "id": "oracle-down",
              "observation": "oracle_ready",
              "op": "eq",
              "value": false,
              "_note": "Oracle 파드가 빠지면 F25-H 꼴 DB 중단이다. 행 삭제는 Oracle 을 멈추지 않는다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "transfer-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "payment-ready",
              "observation": "payment_pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "writes-recovered",
              "observation": "checkout_nonok_rate_baseline",
              "op": "lt",
              "value": 0.1
            },
            {
              "id": "oracle-ready",
              "observation": "oracle_ready",
              "op": "eq",
              "value": true
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 보관 표의 두 행을 그대로(삭제 시점 잔액) 계좌 표에 다시 넣고 두 id 가 모두 있는지 확인한 뒤 보관 표를 지우고 평가한다. 행이 돌아온 다음 정산부터 200 이고, order 의 paymentClient 서킷은 반열림 3회 성공으로 닫힌다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "5m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
