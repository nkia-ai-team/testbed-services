{
  "schema_version": "1.0",
  "id": "F25-H",
  "slug": "f25-h-commerce-postgres-oomkill",
  "readiness": "ready",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "commerce namespace",
    "matrix_location_transport": "K/kubectl postgres StatefulSet mem limit patch(512Mi→320Mi) + R/ssh load.north_south checkout companion",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/k8s.resource",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "kubernetes-original-resource-snapshot",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "k8s.resource",
        "companion_refs": [
          "load.north_south"
        ]
      },
      "runtime": {
        "mode": "calibration",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "30m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "adaptive_ladder",
          "levels": [
            {
              "id": "squeeze-192mi",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "deployment": "testbed-postgres",
                "container": "postgres",
                "resource": "memory",
                "baseline": {
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  },
                  "requests": {
                    "cpu": "200m",
                    "memory": "256Mi"
                  }
                },
                "fault": {
                  "limits": {
                    "cpu": "500m",
                    "memory": "192Mi"
                  },
                  "requests": {
                    "cpu": "200m",
                    "memory": "192Mi"
                  }
                }
              },
              "min_hold": "4m",
              "settle": "30s",
              "timeout": "8m"
            },
            {
              "id": "floor-128mi",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "deployment": "testbed-postgres",
                "container": "postgres",
                "resource": "memory",
                "baseline": {
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  },
                  "requests": {
                    "cpu": "200m",
                    "memory": "256Mi"
                  }
                },
                "fault": {
                  "limits": {
                    "cpu": "500m",
                    "memory": "128Mi"
                  },
                  "requests": {
                    "cpu": "200m",
                    "memory": "128Mi"
                  }
                }
              },
              "min_hold": "4m",
              "settle": "30s",
              "timeout": "8m"
            },
            {
              "id": "floor-96mi",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "deployment": "testbed-postgres",
                "container": "postgres",
                "resource": "memory",
                "baseline": {
                  "limits": {
                    "cpu": "500m",
                    "memory": "512Mi"
                  },
                  "requests": {
                    "cpu": "200m",
                    "memory": "256Mi"
                  }
                },
                "fault": {
                  "limits": {
                    "cpu": "500m",
                    "memory": "96Mi"
                  },
                  "requests": {
                    "cpu": "200m",
                    "memory": "96Mi"
                  }
                }
              },
              "min_hold": "4m",
              "settle": "30s",
              "timeout": "8m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s"
          },
          {
            "id": "pg_restart_count",
            "adapter": "kubernetes",
            "query_id": "kubernetes.container_restart_count",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "deployment": "testbed-postgres",
              "container": "postgres"
            },
            "freshness": "30s"
          },
          {
            "id": "pg_termination_reason",
            "adapter": "kubernetes",
            "query_id": "kubernetes.container_last_termination_reason",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "deployment": "testbed-postgres",
              "container": "postgres"
            },
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s"
          },
          {
            "id": "app_termination_reason",
            "adapter": "kubernetes",
            "query_id": "kubernetes.container_last_termination_reason",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "deployment": "testbed-payment",
              "container": "payment-service"
            },
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "oom-direct",
              "observation": "pg_termination_reason",
              "op": "eq",
              "value": "OOMKilled"
            },
            {
              "id": "restart-visible",
              "observation": "pg_restart_count",
              "op": "gte",
              "value": 1
            },
            {
              "id": "checkout-impact",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.1
            }
          ],
          "consecutive_ticks": 2
        },
        "must_rule_out": {
          "any": [
            {
              "id": "app-container-oom",
              "observation": "app_termination_reason",
              "op": "eq",
              "value": "OOMKilled"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            },
            {
              "id": "restart-budget",
              "observation": "pg_restart_count",
              "op": "gte",
              "value": 6
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "checkout-recovered",
              "observation": "checkout_5xx_rate_baseline",
              "op": "lt",
              "value": 0.05,
              "_note": "이 조건은 완화하지 않는다. run af660719에서 레벨 전환 recovery가 commerce 입구의 baseline 409 flakiness에 걸려 dirty로 끝났지만, 회복 검증은 전역 계약이라 여기서 느슨하게 하면 이 시나리오 하나가 아니라 뒤따르는 모든 런의 clean-window가 거짓이 된다. 409는 주입과 무관한 baseline 입구의 문제이므로 그쪽에서 고쳐야 한다. 2026-08-07 후속: 그 입구 문제의 정체가 재고 공급 버스트로 확인됐고(소비 ~110 units/min 대 10분 주기 배치, flagship 16종 전부 stock=0 실측) ReconciliationBatch를 60초 주기·target 60으로 재척도했다. 평시 재고가 0에 닿지 않으면 이 dirty도 함께 풀릴 것으로 본다 — 다만 이는 아직 가설이며 재배치 후 런으로 확인해야 한다. 확인 전까지 이 조건은 그대로 둔다."
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        },
        "escalate": {
          "any": [
            {
              "id": "oom-not-yet",
              "observation": "pg_restart_count",
              "op": "lt",
              "value": 1
            }
          ],
          "consecutive_ticks": 3
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "k8s.resource",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "k8s.resource",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "k8s.resource"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "postgres StatefulSet kind 일반화(k8s_resource_executor) + postgres 관측 allowlist(live_probes.py F25_H_POSTGRES_TARGET) 배선 완료(07-24)",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
