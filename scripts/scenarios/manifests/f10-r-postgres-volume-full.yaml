{
  "schema_version": "1.0",
  "id": "F10-R",
  "slug": "f10-r-postgres-volume-full",
  "readiness": "parked",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "worker-w1",
    "matrix_location_transport": "tb-w1/ssh",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/host.stress",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "host-placement-and-oob-recovery",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "dry-run",
      "decision_mode": "evaluation",
      "profile": {
        "kind": "fixed",
        "ref": "controller-profiles/f10-r-postgres-volume-full/fixed",
        "requires_approved_fixed_profile": true
      },
      "live_enabled": false
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "host.stress",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "host.stress",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "host.stress"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "unresolved",
    "required": true,
    "description": "구조적 불가 — PGDATA 전용 볼륨이 선행되어야 한다. PVC가 tb-w1 루트FS(/dev/vda1, 38G) 위에 있어 계약대로면 3.1GiB만 차서 사용률 66→74%, PostgreSQL 무피해(G3 실패). 예비를 없애 14G를 채우면 kubelet·containerd가 함께 죽어 노드 DiskPressure 사건이 되어 정답과 다른 사건이 된다(2026-07-28 실측)",
    "live_allowed": false
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
