            "parameters": {
              "domain": "food-delivery"
            },
            "_note": "기준선(loadgen-food)의 메뉴 보기(둘러보기 여정의 step menu, GET /api/restaurants/{id}/menu) 실패율(400 이상 또는 0). 하루 주기 1~6 iter/s 의 55% 라 30초 창에 약 16~100건이다. 잠금 대기열 동안 restaurant 의 메뉴 읽기가 모두 'Waiting for table metadata lock' 으로 줄을 서서, 처음 10건은 풀 연결을 쥔 채 매달리고(k6 시간 제한 60초 또는 파드 재시작에 0) 그 뒤는 연결 대기 3초 끝에 500, NotReady 동안은 연결 거절(0)이다. 평시 0 근처",
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "menu-reads-failing",
              "observation": "menu_read_nonok_rate_baseline",
              "op": "gte",
              "value": 0.5
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 90s, 3틱. run 이 내보내기(약 360초 동안 활성)를 띄우고 그 메타데이터 잠금이 잡힌 것을 본 뒤 마이그레이션을 띄워, 서버가 마이그레이션을 'Waiting for table metadata lock' 으로 보이면 돌아온다(로컬 mysql 8.0.46 실측 run 약 4초). 그 순간부터 menus 를 읽는 모든 질의(restaurant 의 메뉴 읽기, 인기 메뉴 집계)가 줄을 서서 restaurant Hikari 10개가 메뉴 보기 약 3~13건 만에 차고 메뉴 보기가 실패한다. 판정 관측은 30초마다 갱신돼 min_hold 뒤 약 90초에 3틱이 차므로 판정은 약 3분에 끝나고 잠금 대기열(약 6분) 안에 든다. 주문 생성은 기준선 주문 여정이 메뉴 단계에서 멈춰 표본이 끊기므로 판정에 쓰지 않는다. 성공 뒤 cleanup 이 내보내기가 스스로 끝나기를 기다리므로(drain 300초) 녹화에는 잠금 대기열 전체와 스스로 풀리는 모습이 담긴다. timeout 6m 은 내보내기가 끝나는 시각이다"
        },
        "must_rule_out": {
