              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f36-p",
              "parameters": {
                "engine": "mysql",
                "namespace": "rca-testbed-food",
                "pod": "testbed-mysql-0",
                "database": "fooddelivery",
                "table": "menus",
                "add_column": "allergen_note",
                "add_column_type": "varchar(255)",
                "export_columns": "m.id, m.name, m.price, i.order_id, i.qty, i.unit_price",
                "export_join_table": "order_items",
                "export_join_column": "menu_id",
                "export_seconds": 360,
                "drain_seconds": 300,
                "minimum_rows": 50,
                "maximum_sessions": 90
              },
              "min_hold": "90s",
              "settle": "30s",
              "timeout": "6m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "food-delivery"
            },
            "_note": "기준선 문서(loadgen-food)의 주문 생성 단계(30180 → order) 상태. 동반 부하가 없어 기준선 문서를 읽는다. 잠금 대기열 동안 기준선의 주문 여정은 메뉴 조회(restaurant)가 200 이 아니면 주문을 내지 않아 주문 생성이 거의 끊기고, 이 값은 마지막 주문 생성의 상태(대개 200)로 남는다. order 는 Ready 이고 자기 표(orders)는 줄에 서지 않으므로 0(연결 불가)은 order 파드가 빠지거나 노드가 죽었을 때 나온다. 드물게 마이그레이션이 대기에 든 순간 메뉴 확인을 이미 마친 주문 하나가 주문 품목 INSERT(menus 외래 키)에서 줄을 서면 k6 시간 제한(60초) 뒤 0 이 남을 수 있다(주문 생성 초당 0.2~1.2건 x 메뉴 확인부터 품목 INSERT 까지 수십 ms 로 실행당 약 1~5%)",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-mysql"
            },
            "freshness": "30s"
          },
          {
            "id": "order_pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-order"
