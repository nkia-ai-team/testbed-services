            "_note": "상주 기준선(loadgen-commerce)의 마지막 checkout 응답 상태. 동반 부하가 없다. 게이트웨이(30080)는 DB 를 쓰지 않고 읽기는 인가를 거치지 않아 users 줄에 걸리지 않으며, 인가된 쓰기는 user 응답(3초) 또는 연결 거부로 곧 500 을 받는다. 0(연결 불가)은 게이트웨이나 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-user"
            },
            "freshness": "30s",
            "_note": "user-service 는 /actuator/health 에 DB 확인이 들어 있어, 토큰 확인과 로그인이 회원 표 잠금 대기열에 묶여 Hikari 풀(10)이 차면 readiness 가 빠지고 liveness(15초 x 5)가 재시작한다. 다시 뜬 파드는 기동 때 data.sql 의 회원 시드 INSERT 가 같은 줄에 서서 잠금이 풀릴 때까지 뜨지 못하고, startupProbe(5초 x 60) 300초를 넘기면 다시 시작한다. 증상이라 배제 조건에 넣지 않고 복구 확인에만 쓴다"
          },
          {
            "id": "postgres_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s",
            "_note": "commerce PostgreSQL. 이 주입은 프로세스, 설정, 자원을 바꾸지 않는다(세션 둘과 열 하나). Ready 가 빠지면 표 하나의 잠금 대기열이 아니라 DB 다운(F25-H 꼴)이다"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s",
            "parameters": {
