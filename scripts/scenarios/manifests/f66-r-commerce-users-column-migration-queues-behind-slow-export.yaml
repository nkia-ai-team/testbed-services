    "matrix_location_transport": "R/ssh db.ddl commerce testbed-postgres-0 내보내기 COPY(users ⋈ auth_tokens, 행 추정/420 행마다 1초 쉬는 읽기 쪽) + ALTER TABLE user_schema.users ADD COLUMN marketing_opt_in boolean(kubectl exec psql 을 DB 파드 안에서 백그라운드로, 내보내기 잠금 확인 뒤 마이그레이션을 띄우고 내보내기 뒤에서 기다리는 것이 보이면 run 종료, 두 세션 application_name 'PostgreSQL JDBC Driver', 탐침은 pg_stat_statements 기록 안 함, preflight 가 열 없음, 두 세션 없음, lock_timeout·statement_timeout 0, 그 표 대기 잠금 0, 열린 세션 ≤70) (동반 부하 없음, 상주 commerce 기준선이 쓰기를 냄)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.ddl"
    ]
