          {
            "id": "checkout_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s",
            "parameters": {
              "domain": "commerce"
            },
            "_note": "상주 기준선(loadgen-commerce, 하루 주기 2~10rps, 여정의 8% 가 checkout, 사전 할당 VU 20)의 checkout 단계. checkout 여정은 login(userId) 로 시작하는데 VU 마다 (사용자 20명) 토큰을 24시간 캐시해, 캐시가 있으면 로그인 요청 없이 장바구니 비우기, 담기, checkout 을 보낸다(commerce/loadgen/script.js:93-113, 194-230). 주입 뒤 캐시가 없는 쌍은 login 이 users 줄(findByEmail)에 막혀 실패하고 여정을 끝내 checkout 을 보내지 않으므로 표본이 되지 않는다. 캐시가 있는 쌍은 쓰기 셋 모두 게이트웨이 인가(verify-token 의 users 읽기)에서 500 이라 checkout 이 5xx 다. 그래서 표본이 있는 창은 5xx 비율이 1 에 가깝다. 표본 수는 캐시된 쌍의 비율에 달린다: 기준선 k6 는 매시 정각 다시 시작해 캐시가 비고, 쌍 400 개(VU 20 x 사용자 20)가 시간당 checkout 576~2,880 번으로 채워진다. 정각 뒤 약 10~30분이 지나면 30초 창마다 checkout 약 2~20건이 표본이 된다. 정각 직후이거나 주입 중 정각이 지나면 표본이 줄어 판정이 늦어질 수 있다(F16-H 와 같은 성질, 그래서 min_hold 를 150s 로 짧게 둔다). 표본이 0 인 창은 필드가 빠져 unusable 이고 0.0 으로 읽히지 않는다(loadgen_monitor.py)"
          },
          {
            "id": "checkout_2xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "freshness": "30s",
            "parameters": {
              "domain": "commerce"
            }
          },
          {
            "id": "read_nonok_rate",
            "adapter": "loadgen_summary",
