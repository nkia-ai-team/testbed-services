          "_note": "min_hold 150s, 3틱. run 이 내보내기(약 420초 동안 활성)를 띄우고 그 잠금이 잡힌 것을 본 뒤 마이그레이션을 띄워, 서버가 마이그레이션을 내보내기 뒤에서 기다리는 것으로 보이면 돌아온다(로컬 실측 2.2초). 그 순간부터 users 를 읽는 모든 질의가 줄을 서서 캐시된 토큰의 checkout 이 곧 500 이다. 판정은 동반 부하가 아니라 주입 전부터 토큰을 캐시해 둔 상주 기준선에서 한다(동반 k6 는 주입과 거의 같은 순간에 떠 캐시가 비어 checkout 이 로그인에서 끝나 표본이 생기지 않는다). min_hold 를 150s 로 둔 것은 표본이 사라질 수 있는 기준선 k6 의 매시 재시작 전에 판정을 끝내기 위해서다(F16-H 와 같은 이유). 판정 관측은 30초마다 갱신돼 min_hold 뒤 약 90초에 3틱이 찬다. 성공 뒤 cleanup 이 내보내기가 스스로 끝나기를 기다리므로(drain 300초) 녹화에는 잠금 대기열 전체(약 7분)와 스스로 풀리는 모습이 담긴다. timeout 7m 은 내보내기가 끝나는 시각이다"
        },
