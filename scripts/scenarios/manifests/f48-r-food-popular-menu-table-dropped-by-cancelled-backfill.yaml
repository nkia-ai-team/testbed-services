            "freshness": "30s"
          },
          {
            "id": "restaurant_error_rate",
            "adapter": "clickhouse",
            "query_id": "clickhouse.service_error_rate",
            "parameters": {
              "service_name": "food-delivery-restaurant"
            },
            "_note": "restaurant 서버 스팬(표본 10%) 60초 창의 5xx 백분율. 동반 부하가 가게 화면마다 상세, 메뉴, 인기 메뉴를 하나씩 불러 고장 중에는 약 25~30%. 실패가 restaurant 가 답한 5xx 인지(연결 실패가 아닌지) 확인하는 몫이다. 평시 7일 표본 205,276건 중 5xx 8건",
            "freshness": "60s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "order_create_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "parameters": {
              "domain": "food-delivery"
            },
            "_note": "기준선(loadgen-food)의 주문 생성 5xx 비율. 주문 경로는 인기 메뉴 표를 읽지 않아 고장 중에도 0 근처여야 한다. 오르면 가게 조회나 배차 쪽 고장(F36-R, F32-R, F33-R 꼴)이지 이 시나리오가 아니다",
            "freshness": "30s"
          },
          {
            "id": "order_create_2xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "parameters": {
              "domain": "food-delivery"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "popular-menu-failed",
              "observation": "popular_menu_nonok_rate",
              "op": "gte",
              "value": 0.8
            },
            {
              "id": "restaurant-5xx",
              "observation": "restaurant_error_rate",
              "op": "gte",
              "value": 10
            }
          ],
          "consecutive_ticks": 3
        },
        "must_rule_out": {
