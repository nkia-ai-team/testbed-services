            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "food-delivery"
            },
            "_note": "기준선 문서의 주문 생성 단계(30180 → order) 상태. 동반 부하(popular-menu-surge.js)는 주문을 넣지 않아 자기 문서의 entry_status 가 비므로 기준선 문서를 읽는다. 고장 중 order 는 인기 메뉴 표를 읽지 않아 그대로 답하므로 0(연결 불가)은 노드나 order 가 죽었을 때만 나온다",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-mysql"
            },
            "freshness": "30s"
          },
          {
            "id": "restaurant_pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-restaurant"
            },
            "freshness": "30s"
          },
          {
            "id": "popular_menu_nonok_rate",
