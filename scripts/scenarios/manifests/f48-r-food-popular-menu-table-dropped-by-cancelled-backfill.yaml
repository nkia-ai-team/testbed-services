              "_note": "동반 부하 5rps 의 1/4. 인기 메뉴가 즉시 500 으로 끝나 여정이 짧아지므로 반복률은 떨어지지 않는다. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "food-db-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "MySQL 파드가 빠지면 표 하나가 사라진 것이 아니라 DB 다운(F25-H 꼴)이다"
            },
            {
              "id": "restaurant-down",
              "observation": "restaurant_pod_ready",
              "op": "eq",
              "value": false,
              "_note": "restaurant 파드가 빠지면 인기 메뉴 실패가 SQL 오류가 아니라 연결 실패다. 표가 사라져도 health 의 SELECT 1 은 그대로라 restaurant 는 Ready 로 남아야 한다"
            },
            {
              "id": "order-path-failing",
              "observation": "order_create_5xx_rate_baseline",
              "op": "gte",
              "value": 0.5,
              "_note": "주문 생성까지 실패하면 가게 표(F36-R)나 배차(F32-R, F33-R) 쪽 고장이다. 이 시나리오는 인기 메뉴 집계 표만 사라져 주문 경로는 그대로다"
            }
