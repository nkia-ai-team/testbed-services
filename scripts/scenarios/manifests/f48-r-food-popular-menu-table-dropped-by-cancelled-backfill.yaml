      "live_enabled": true,
      "binding": {
        "primary_ref": "db.ddl",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "db.ddl"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "25m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f48-r",
              "parameters": {
                "engine": "mysql",
                "namespace": "rca-testbed-food",
                "pod": "testbed-mysql-0",
                "database": "fooddelivery",
                "table": "menu_popularity_summary",
                "backfill_index": "idx_menu_popularity_restaurant",
