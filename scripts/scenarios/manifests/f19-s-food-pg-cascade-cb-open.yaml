{
  "schema_version": "1.0",
  "id": "F19-S",
  "slug": "f19-s-food-pg-cascade-cb-open",
  "readiness": "ready",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "food external-pg-mock",
    "matrix_location_transport": "K/kubectl → food MockServer /pay delay 30s(>read-timeout 10s)",
    "transport": "api-via-kubectl",
    "profile_refs": [
      "injector-profiles/mock.expectation",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-api-contract",
      "mock-restore-contract",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "mock.expectation",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "mock.expectation"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "15m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f19-s",
              "parameters": {
                "path": "/pay",
                "mode": "delay",
                "status_code": 200,
                "delay_seconds": 30
              },
              "min_hold": "8m",
              "settle": "45s",
              "timeout": "13m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-payment"
            },
            "freshness": "30s"
          },
          {
            "id": "payment_error_rate",
            "adapter": "clickhouse",
            "query_id": "clickhouse.service_error_rate",
            "parameters": {
              "service_name": "food-delivery-payment"
            },
            "freshness": "60s"
          },
          {
            "id": "order_create_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "freshness": "30s"
          },
          {
            "id": "order_create_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "parameters": {
              "domain": "food-delivery"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "order-502-propagated",
              "observation": "order_create_5xx_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "dispatch 노이즈 상한은 0.098이다(run 4957e483 트레이스 직독: POST /api/orders 200=358·429=33·400=5·503=43 → 43/439). 그 503은 주입과 무관하게 dispatch-service 자체 500에서 오며 OrderService가 checkCapacity·dispatchCourier 실패를 무조건 503으로 바꾼다(OrderService.java:94-112, DispatchClient.java:66-79). 임계 0.1은 이 노이즈 바로 위라 '주입 없이도 성공이 설 수 있는' 거짓 양성 구조였다. 실측 주입 피해는 run b7d83934의 평가 틱 41개 전부가 0.913~1.0으로, 최솟값조차 노이즈의 9배다. 0.5는 그 아래로 충분히 떨어져 있다. payment_error_rate를 두 번째 AND로 되살리지 않는 이유도 같은 런에 있다 — 초반 3틱만 66.67이고 이후 내내 0.0이다. 서킷이 열리면 payment가 PG를 부르지 않고 즉시 반려하므로 자기 오류율이 사라진다(c887e20의 '구조적으로 움직이지 않는다'가 실측으로 확인된다). 감별자로서의 payment_error_rate는 must_rule_out에 두는 것이 맞고 성공 조건에는 둘 수 없다. 질문 '주입 없이 이 조건이 설 수 있는가'의 답은 이제 '없다'이다."
            }
          ],
          "consecutive_ticks": 3
        },
        "must_rule_out": {
          "any": [
            {
              "id": "external-rate-limit",
              "observation": "entry_status",
              "op": "eq",
              "value": 429
            },
            {
              "id": "payment-pod-failure",
              "observation": "pod_ready",
              "op": "eq",
              "value": false
            },
            {
              "id": "baseline-arm-also-failing",
              "observation": "order_create_5xx_rate_baseline",
              "op": "gte",
              "value": 0.2,
              "_note": "무주입 대조 팔이 오염되면 주입 효과를 귀속할 수 없다. run cae8c16c 실측: 주입 팔 0.795~0.978 인데 **대조 팔이 0.840~1.000** 으로 같거나 더 높았고(el=79 에서 0.911 대 1.000), payment_error_rate 는 전 구간 0.000 이었다 — 즉 /pay 429 주입이 만든 피해가 없는데 성공이 확정됐다. 기록된 F19 런 6개 전부 대조 팔 중앙값이 0.93~1.00 이다(aa75203a·cae8c16c·d68b4fb3·01df886f·377a2aad·b7d83934). 원인은 food courier 풀 포화로, 풀이 마르면 주문 생성이 전부 503 이 되어 order 집계 5xx 를 양쪽 팔 모두 1.0 으로 민다. 따라서 **임계 상향으로는 못 막는다** — 147363d 가 0.1→0.5 로 올렸으나 대조 팔이 그 두 배였다. 올바른 게이트는 '주입 팔 − 대조 팔'이지만 러너 Condition 은 signal↔리터럴 비교만 지원하고 (adaptive.py Condition: signal/operator/value:Scalar, StrictModel) 두 관측 비교 문법이 없다 — 러너 변경 대기. 그때까지 이 감별자로 **fail-closed** 한다: 대조 팔이 0.2 이상이면 환경이 이미 신호를 포화시킨 것이므로 이 런은 귀속 불가로 실격시킨다. 성공 임계 0.5 의 절반을 경계로 잡았다."
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "payment-errors-cleared",
              "observation": "payment_error_rate",
              "op": "lt",
              "value": 5
            },
            {
              "id": "create-cleared",
              "observation": "order_create_5xx_rate_baseline",
              "op": "lt",
              "value": 0.05
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "mock.expectation",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
