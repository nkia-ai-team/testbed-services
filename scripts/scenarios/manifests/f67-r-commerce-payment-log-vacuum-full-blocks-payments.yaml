          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "payment_logs 다시 쓰기가 끝나면 줄 선 INSERT 가 한꺼번에 지나가고 결제가 돌아온다. 재시작 고리에 있던 payment 는 기동 CREATE INDEX 가 잠금 해제 뒤 끝나 곧 Ready 가 되지만 CrashLoopBackOff 지연이 남을 수 있어 timeout 10m 이다. 동반 부하는 cleanup 에서 먼저 멈추므로 checkout 비율은 복구 조건에 넣지 않는다(F06-H 와 같음). cleanup 은 두 세션이 스스로 끝나기를 최대 720초 기다리고 남으면 취소한다(옛 사본 유지)"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "14m"
        },
