          "consecutive_ticks": 2,
          "_note": "필수 중단(compile-plan). 신청은 대부분 몇 초 걸려 200 이거나 3초 풀 기다림 뒤 500 이다. 남는 위험은 큐에 오래 묶인 신청이 10초 시간 초과(0)가 되고 15초 뒤 다음 틱의 마지막 신청도 그런 경우뿐이다(모의 10분: 16~18시 비 약 1.06 에서 0~수 %(표본 적음), 창 위쪽 끝에서 약 2~7%, 설계 시트 §9-3, §9-4. WAS fwupd 내려받기 같은 1분짜리 몰림이 겹치면 모의보다 클 수 있다). preflight 의 상한 112% 가 이 위험을 묶는다. 3초 설정이 아직 두 WAS 에 없으면(옛 10초) 풀 기다림이 부하기 시간 제한과 같아져 이 조건이 실행을 끊을 수 있다"
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
