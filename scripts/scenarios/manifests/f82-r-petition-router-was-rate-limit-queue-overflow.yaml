  "injection": {
    "location": "civil-petition rt-core01",
    "matrix_location_transport": "V/ssh router.qdisc(civil-petition rt-core01, 모드 operator-rate: 실행기 opsjob 이 상시 관리 연결로 ens20 송신을 6초 재어 제한의 102~112% 일 때만 가드를 걸고, 운영자 sysop 이 192.168.127.5 에서 ssh 로그인해 sudo tc qdisc add)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/router.qdisc"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "network-oob-recovery"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "router.qdisc",
        "companion_refs": [],
