              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "target-health"
            },
            {
              "check": "vm-entry-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f82-r",
              "parameters": {
                "host": "192.168.127.2",
                "node": "rt-core01",
                "mode": "operator-rate",
                "device": "ens20",
                "rate_kbit": 400,
                "burst_kb": 32,
                "latency_ms": 400,
                "min_load_pct": 102,
                "max_load_pct": 112
              },
              "min_hold": "10m",
              "settle": "60s",
              "timeout": "15m"
