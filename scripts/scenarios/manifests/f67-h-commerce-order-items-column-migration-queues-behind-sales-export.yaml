          ],
          "consecutive_ticks": 3,
          "_note": "run 은 내보내기(COPY, 약 360초 동안 활성)를 DB 파드 안에서 띄우고 그 ACCESS SHARE 잠금이 잡힌 것을 본 뒤 마이그레이션을 띄워, 서버가 마이그레이션을 내보내기 뒤에서 기다리는 것으로 보이면 돌아온다(로컬 실측 1.9초). 그 순간부터 checkout 마다 order_items INSERT 가 줄을 서서 동반 부하(checkout 초당 약 5건)로 order 풀 10 이 약 2초 안에 차고, checkout 은 약 15초(게이트웨이 order read-timeout) 뒤부터 5xx 다. 잠금 구간은 내보내기 시간이다: 로컬(0.5 CPU, 같은 크기 사본 643만 행) 목표 120초가 실제 약 144초였다(받는 쪽 속도 오차 약 2할). 그래서 109 잠금 구간은 약 360~430초다. 성공 streak 은 min_hold 동안에도 쌓이고 독립 표본 간격이 30초라 첫 참 표본(약 45초) 뒤 60초인 약 105초에 판정한다. 판정은 잠금 구간의 약 3할 지점이다. timeout 6m 은 내보내기가 끝나는 시각(360초)이다. 성공 뒤 cleanup 이 내보내기가 스스로 끝나기를 기다리므로(drain 300초) 녹화에는 대기열 전체와 스스로 풀리는 모습이 담긴다"
