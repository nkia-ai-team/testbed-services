{
  "schema_version": "1.0",
  "id": "F69-P",
  "slug": "f69-p-commerce-inventory-release-ledger-check-holds-stock-locks",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "commerce namespace",
    "matrix_location_transport": "K/kubectl commerce testbed-inventory 컨테이너 image set(commerce-inventory:latest→commerce-inventory:1.3.0, 직전에 runner 가 tb-ops docker 의 1.3.0 을 docker save → ssh tb-w1 ctr import, cleanup 이 되돌린 뒤 노드에서 이름과 ID 참조 모두 ctr images rm) + R/ssh load.north_south companion(commerce surge.js, target_rps=3, 여정 50% checkout)",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/k8s.image",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "kubernetes-original-spec-snapshot",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "k8s.image",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "k8s.image"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "20m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f69-p",
              "parameters": {
                "mode": "release",
                "namespace": "rca-testbed-commerce",
                "deployment": "testbed-inventory",
                "container": "inventory-service",
                "baseline_image": "commerce-inventory:latest",
                "fault_image": "commerce-inventory:1.3.0"
              },
              "min_hold": "8m",
              "settle": "60s",
              "timeout": "14m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "_note": "commerce 진입점(nginx → 게이트웨이) 상태. 게이트웨이는 order, product 가 준 5xx 를 그대로 돌려주거나 시간 초과로 502 를 낼 뿐 스스로 죽지 않는다. 0(연결 불가)은 nginx, 게이트웨이, 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s",
            "_note": "동반 부하(surge.js 3rps, 여정의 50% 가 checkout) checkout 단계 5xx 비율(60초 창). 평시 0 근처. checkout 은 order → product reserve-stock → inventory 예약(재고 행 FOR UPDATE)을 상품마다 부르는데, 릴리스 1.3.0 의 재조정 배치가 재고 행 16개를 공유 잠금으로 약 45초 쥐는 동안 예약이 모두 기다린다. 게이트웨이 → order 읽기 시간 제한 15초를 넘기는 checkout(잠금 구간 시작부터 끝나기 15초 전까지 시작한 것)과 inventory 풀(10)이 예약 대기로 차서 준비 안 됨으로 빠진 구간의 checkout 이 5xx 다. 배치 주기(잠금 약 45초 + 쉼 60초 ≈ 105초)에서 약 30초가 실패 구간이라 60초 창 비율은 0~0.5 사이를 오간다"
          },
          {
            "id": "checkout_409_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_409_rate",
            "freshness": "30s",
            "_note": "동반 부하 checkout 409(재고 부족) 비율. 릴리스는 같은 배치 끝의 보충(20 미만이면 60 으로)을 그대로 두므로 재고가 마르지 않는다. 오르면 보충 정지(F23-R 꼴)다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-inventory"
            },
            "freshness": "30s",
            "_note": "inventory 파드. 잠금 구간에 풀이 차면 /actuator/health 의 DB 확인이 연결을 못 얻어 몇십 초 준비 안 됨이 될 수 있으므로 배제 조건에 넣지 않고 복구 확인에만 쓴다"
          },
          {
            "id": "postgres_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s",
            "_note": "commerce PostgreSQL. 빠지면 DB 장애(F25-H 꼴)다"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "read_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s",
            "_note": "기록만 한다. 상주 기준선 상품 목록 단계(GET /api/products) 4xx+5xx. 목록은 inventory 를 부르지 않아 잠금과 무관하다(배치의 합계 질의가 PostgreSQL CPU 를 나눠 쓰는 만큼만 느려진다)"
          }
        ],
        "success": {
          "all": [
            {
              "id": "checkout-failing-in-lock-windows",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.1,
              "_note": "60초 창 비율이 실패 구간(약 30초/105초)과 6초 넘게 겹치면 0.1 을 넘는다. 창 시작이 한 주기 105초 중 약 78초 동안 그렇게 겹치므로 15초 틱 3번 연속이 성립한다. 결정적 결함이라 강도 사다리가 없다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 8m: 롤아웃(새 inventory 파드 기동 약 40초~1분, 기본 전략이라 새 파드가 Ready 가 된 뒤 옛 파드가 내려감), 새 파드는 기동 직후 배치를 한 번 돌리고 그 뒤 60초마다 돈다. 동반 부하 ramp 2m. timeout 14m"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1,
              "_note": "동반 부하 3rps 의 1/3. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "commerce-db-down",
              "observation": "postgres_ready",
              "op": "eq",
              "value": false,
              "_note": "PostgreSQL 이 죽거나 재시작하면 F25-H 꼴이다"
            },
            {
              "id": "stock-depleted",
              "observation": "checkout_409_rate",
              "op": "gte",
              "value": 0.3,
              "_note": "checkout 이 재고 부족 409 로 실패하면 보충 정지(F23-R 꼴)이지 잠금 대기가 아니다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "inventory-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "db-ready",
              "observation": "postgres_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "checkout-recovered",
              "observation": "checkout_5xx_rate",
              "op": "lt",
              "value": 0.05
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 이미지를 commerce-inventory:latest 로 되돌리고 롤아웃 available(상한 180초, 실행기가 확인), 1.3.0 을 쓰는 파드가 없어진 뒤 tb-w1 containerd 에서 1.3.0 참조 제거까지 마친 뒤 평가한다. 매니페스트 이미지의 배치는 잠금 없이 마지막 원장 행만 보므로 곧 정상이다. 남는 것은 1.3.0 이 첫 대사에서 남긴 보정 ADJUST 행(상품당 많아야 한 행)뿐이고, 그 행의 resulting_stock 이 그때 stock 이라 옛 배치의 대사와 어긋나지 않는다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "k8s.image",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "k8s.image",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "k8s.image"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
