{
  "schema_version": "1.0",
  "id": "F71-R",
  "slug": "f71-r-commerce-postgres-app-account-password-expiry",
  "readiness": "ready",
  "stage": "official",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh db.account commerce testbed-postgres-0 ALTER ROLE \"commerce\" VALID UNTIL '<지금>'(kubectl exec psql local 소켓 trust, pg_stat_statements 기록 끔, preflight 가 기한 없음·로그인 가능·네트워크 규칙 scram-sha-256·파드 안 네트워크 로그인 성공 확인, run 뒤 네트워크 로그인 거절 확인, 역 문장 VALID UNTIL 'infinity') (동반 부하 없음, 상주 기준선 loadgen-commerce 의 브라우징·검색 80% 는 로그인 없이 계속 흐름)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.account"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "db-inverse-ddl-ready"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "db.account",
        "companion_refs": [],
        "approved_profile_id": "db.account"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "40m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f71-r",
              "parameters": {
                "engine": "postgresql",
                "namespace": "rca-testbed-commerce",
                "pod": "testbed-postgres-0",
                "account": "commerce",
                "change": "password-valid-until-now"
              },
              "min_hold": "31m",
              "settle": "60s",
              "timeout": "37m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "commerce"
            },
            "_note": "commerce 진입점(게이트웨이 30080) 상태. 게이트웨이는 DB 를 쓰지 않아 만료 중에도 살아서 하류 실패를 500, 502 로 답하므로 0(연결 불가)은 게이트웨이나 노드가 죽었을 때만 나온다",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s",
            "_note": "러너 고정 대상(commerce 진입점 30080/health). compile-plan 이 recovery 에 target_health==200 을 요구해서 둔다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s",
            "_note": "commerce PostgreSQL 파드. 만료는 비밀번호 로그인만 거절하고 인스턴스는 그대로라 고장 내내 true 여야 한다"
          },
          {
            "id": "user_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-user"
            },
            "freshness": "30s",
            "_note": "user 파드. 풀 수명 10분이라 만료 뒤 약 10분 안에 풀이 비고 /actuator/health 의 DB 확인이 실패해 readiness 에서 빠지며, liveness(같은 경로) 5회 실패로 재시작한 컨테이너는 기동 중 Hikari 풀 초기화가 'password authentication failed for user \"commerce\"' 로 실패해 재시작을 되풀이한다. 성공 조건에는 쓰지 않는다(회복 조건)"
          },
          {
            "id": "product_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-product"
            },
            "freshness": "30s",
            "_note": "product 파드. Hikari 기본값(풀 10, max-lifetime 30분)이라 만료 뒤 30분 안에 마지막 연결이 사라지고 user 와 같은 길로 빠진다. 회복 조건"
          },
          {
            "id": "read_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s",
            "_note": "기준선(loadgen-commerce) 조회 단계(브라우징 65%, 검색 15%: 게이트웨이 → product) 비정상 비율. 조회는 로그인이 필요 없어 부하 쪽이 로그인을 못 해도 계속 흐른다. product 풀이 비어 readiness 에서 빠지면 게이트웨이가 502(WARN 'Downstream unavailable for GET /api/products ...')로 답해 약 1.0 이 된다. 평시 0 근처"
          },
          {
            "id": "write_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.write_step_status_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s",
            "_note": "쓰기 단계(장바구니 담기, 비우기, checkout) 비정상 비율. user 가 빠지면 게이트웨이 AuthGuard 토큰 확인이 실패해 쓰기가 500 이 되지만, 부하 쪽이 새 로그인을 못 하면 쓰기를 보내지 않아 꺼지므로(F65-P 와 같은 성질) 성공 조건에는 쓰지 않는다. 회복 조건"
          }
        ],
        "success": {
          "all": [
            {
              "id": "browsing-failing",
              "observation": "read_nonok_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "product 풀(Hikari 기본 max-lifetime 30분)이 비어 readiness 에서 빠지면 게이트웨이가 상품 조회를 502 로 답한다. 만료 뒤 30분이면 어느 시간대에도 product 의 모든 연결이 수명을 다한다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 31m: 만료 시각에 있던 연결은 모두 그 전에 만들어졌으므로 user, cart, pricing, shipping 은 10분, product, order, payment, inventory 는 30분 안에 풀이 빈다. 그 뒤 readiness 3회 실패(30초)로 product 가 빠진다. 판정은 만료 뒤 약 31.75분에 나고, 그때 쓰기는 약 20분, 조회는 약 1분 넘게 실패 중이다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "external-rate-limit",
              "observation": "entry_status",
              "op": "eq",
              "value": 429
            },
            {
              "id": "commerce-db-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "PostgreSQL 파드가 빠지면 계정 만료가 아니라 DB 다운(F25-H 꼴)이다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "db-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "user-recovered",
              "observation": "user_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "product-recovered",
              "observation": "product_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "browsing-recovered",
              "observation": "read_nonok_rate",
              "op": "lt",
              "value": 0.05
            },
            {
              "id": "writes-recovered",
              "observation": "write_nonok_rate",
              "op": "lt",
              "value": 0.05
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "15m",
          "_note": "cleanup 이 만료를 없애면(VALID UNTIL 'infinity') 재시작을 되풀이하던 여덟 서비스의 컨테이너가 다음 재시작에서 붙는다. CrashLoopBackOff 대기(최대 5분)와 기동, startupProbe 통과(60회 x 5초 안, 평시 약 40~90초)를 합해 약 7.5분이라 15m 이면 dirty 없이 닫힌다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "db.account"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "db.account"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "db.account"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
