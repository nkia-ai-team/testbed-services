          "_note_ct": "ct 3 -> 2 -> 1 (2026-08-20). 검증 런 2개(9b6b9382·ec55c8c3) 실측: order_p95 는 60s 수집창 게이지라 '슬로쿼리가 완료된 분'(1만~5.8만ms)과 '안 걸린 분'(15~1300ms)이 교대하는 이봉이고, 교대 주기가 독립창(60s)과 같은 차수라 연속 2 독립표본(ct2)이 확률 게임이 된다(9b6b: ct2 도달 2회 모두 확정 틱 직전 리셋, ec55: 최대 1). 표본 하나가 이미 max_over_time 으로 붕괴된 60s 집계이므로 ct1 = '완전한 1분간 양 축 동시 피해'다. 거짓 통과 audit: op95>=1500 은 비주입 583틱 실측 상한 ~400ms 로 도달 불가, pp>=150 은 settling 상한 115.7ms 위. 스트릭 재생: ct1 = 08-10 수리 이후 5런 5/5(발화 e93~327), 전체 20/28; ct2+mh90 은 3/5."
