              "_note_min_hold": "세 단 모두 5m -> 3m (2026-08-11). F15-H 와 같은 구조 — 성공 창이 min_hold 안에서 닫힌다. 6차 run 2bbb3499 실측: success 스트릭이 el=265 에 ct=3 을 채웠으나 전부 reason=min_hold 였고, min_hold 300s 이후에는 2 까지밖에 못 올라갔다. 단 timeout 은 8m 이므로 3m 은 판정 구간 180~480s 를 남긴다. 검증된 모의에서 el=265 발화.",
              "min_hold": "90s",
              "settle": "30s",
              "timeout": "12m",
              "_note_hold": "hold 6m->10m, timeout 8m->12m (2026-08-20). rps1 이 유일하게 게이지가 살아남는 단(rps2+ 는 p95 게이지 기아로 decision_observation_unavailable abort — 실측 3adcd962 외 다수)이므로 pin 대상. 판정 창을 넓혀 요동하는 게이지가 확정 틱을 만날 기회를 늘린다. ramp+hold+ramp == timeout 등식은 유지. | min_hold 3m->90s (2026-08-20 2차). 검증 런 9b6b9382 실측: ct2 스트릭이 el=143(min_hold 안)에서 이미 찼는데 확정이 180s 게이트에 막혔고, 첫 확정 기회(e190) 직전 op95 이봉의 저봉(27.96ms)이 리셋했다. 스트릭 재생: mh180 은 이 런 escalate/실패, mh90 은 e143 성공 — 08-10 수리 이후 4런 기준 mh90 3/4, mh180 2/4. min_hold 90s 는 ramp_up 60s 보다 길어 주입 과도기는 여전히 배제된다. 거짓 통과 불가: op95>=1500 은 베이스라인(최대 ~400ms)이 물리적으로 못 넘는다(583틱 0건)."
