            "_note": "민원 포털 상주 부하기(loadgen VM)의 마지막 민원 신청 상태. db01 이 thrashing 으로 먹통이 되면 커널은 살아 TCP 연결은 맺어 주지만 PostgreSQL 이 시작 패킷에 제때 답하지 못해, 앱 DB 기다림 상한 3초(PgJDBC loginTimeout 이 연결 시도 전체를 3초에 끊음, connectTimeout, 풀 maxWait)로 새 연결과 풀 빌리기가 3초 남짓에 실패해 신청은 500 으로 답한다. 0(응답 없음)은 먹통이 되는 순간 WAS 마다 열려 있던 풀 연결(평시 약 5개)을 빌린 요청과 넘어가는 구간에 느리게라도 답을 받던 요청 몇 개뿐이고, 그 뒤 몇 초 안의 다음 신청 500 이 값을 덮는다(설계 시트 §9 모의). 리셋 뒤 부팅 동안은 5432 가 닫혀 즉시 503",
