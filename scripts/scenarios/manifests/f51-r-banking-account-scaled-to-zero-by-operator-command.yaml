{
  "schema_version": "1.0",
  "id": "F51-R",
  "slug": "f51-r-banking-account-scaled-to-zero-by-operator-command",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "banking namespace",
    "matrix_location_transport": "K/kubectl banking testbed-account scale(replicas 1→0) + R/ssh load.north_south companion(core-banking transfer-heavy-surge.js, target_rps=5, 하루 주기 1~4 iter/s 기준선 위 core-banking-api 표본 스팬 확보)",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/k8s.scale",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "kubernetes-recovery-capacity",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "k8s.scale",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "k8s.scale"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "25m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f51-r",
              "parameters": {
                "namespace": "rca-testbed-banking",
                "deployment": "testbed-account",
                "from_replicas": 1,
                "replicas": 0
              },
              "min_hold": "15m",
              "settle": "60s",
              "timeout": "20m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "기준선 문서의 이체 단계(nginx → api) 상태. account 파드가 없어도 nginx 와 api 는 살아서 502 로 답하므로 0(연결 불가)은 nginx 나 노드가 죽었을 때만 나온다",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s",
            "_note": "러너 고정 대상(commerce 진입점 30080/health)이라 banking 고장과 무관하다. compile-plan 이 recovery 에 target_health==200 을 요구해서 둔다. 판정력은 없다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-transfer"
            },
            "_note": "transfer 파드. 이 주입은 transfer 를 건드리지 않아 고장 중에도 Ready 여야 한다(빠지면 F17-R, F17-H, F50-R 꼴의 하류 장애). account 파드는 러너 kubernetes 프로브 허용 목록(live_probes APPROVED_K8S_TARGETS)에 없어 보지 않는다",
            "freshness": "30s"
          },
          {
            "id": "oracle_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-oracle"
            },
            "_note": "Oracle 파드. 이 주입은 Oracle 을 건드리지 않는다. 빠지면 DB 장애(F35-R, F01-P 계열)다",
            "freshness": "30s"
          },
          {
            "id": "balance_read_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "_note": "동반 부하(core-banking transfer-heavy-surge.js 5rps)의 잔액 조회(step get, 35%, nginx → account 직행) 실패율. 30초 창에 약 50건, 평시 0. account 파드가 없으면 nginx 의 upstream testbed-account:8081 연결이 거절되어 nginx 502 로 거의 1 이다",
            "freshness": "30s"
          },
          {
            "id": "transfer_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "_note": "동반 부하의 이체(step transfer, 40%, nginx → api → account → transfer) 5xx 비율. 질의 이름은 food 지만 선택자는 도메인 공통 business.5xx.rate 다. 평시 업무 거절은 400(잔액 부족)이라 5xx 는 0. account 파드가 없으면 api 의 account 호출이 Connection refused, 재시도, 서킷 열림 끝에 502 다",
            "freshness": "30s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "transfer_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "상주 기준선(loadgen-banking)의 이체(step transfer, 10%, nginx → api → account → transfer) 5xx 비율. 평시 0(2026-10-08 19:33 UTC KST 04:33 기준선 문서 checkout_count 4, business_5xx_rate 0.0), 고장 중 기준선 이체도 account 를 거쳐 약 1.0. 가장 한가한 1 iter/s 에서 30초 창 이체 기대 약 3건이라 창에 이체가 없으면 필드가 빠져 unusable 이 될 뿐 통과로 읽히지 않는다. 동반 부하가 끝난 뒤의 회복 판정에 쓴다",
            "freshness": "30s"
          },
          {
            "id": "balance_read_nonok_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "상주 기준선(loadgen-banking)의 잔액 조회(step get, 55%, nginx → account 직행) 실패율. 평시 0, 하루 주기 1~4 iter/s 라 30초 창에 잔액 조회 약 16~66건. 동반 부하가 끝난 뒤의 회복 판정에 쓴다",
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "transfers-failing-5xx",
              "observation": "transfer_5xx_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "api 가 account 로 넘기는 이체가 연결 거절(testbed-account 엔드포인트 없음)로 실패하고 재시도 3회, 서킷 열림 끝에 502. 이 502 가 core-banking-api 서버 스팬을 ERROR 로 만들어 골든 시그널 오류율을 올린다"
            },
            {
              "id": "balance-reads-failing",
              "observation": "balance_read_nonok_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "nginx → account 직행 잔액 조회도 nginx 502. 이체만 실패하는 F39-R(account 의 하류 주소 오설정, 잔액 조회 정상)과 account 를 지나지 않는 경로가 실패하는 F50-R, F17-H(transfer 파드 없음, 잔액 조회 정상)를 가른다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 15m: scale 직후 account 파드가 종료 유예 안에 내려가고(수 초) 그 뒤 실패가 이어진다. banking 선례(F39-R 시트 §6)는 promote 지연이 약 18~20분이라 고장 15분과 식힘 구간 안에서 인시던트가 생긴다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1.25,
              "_note": "동반 부하 5rps 의 1/4. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "transfer-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "transfer 파드가 빠지면 하류 장애(F17-R, F17-H, F50-R 꼴)다. 이 주입은 transfer 를 건드리지 않는다"
            },
            {
              "id": "oracle-down",
              "observation": "oracle_ready",
              "op": "eq",
              "value": false,
              "_note": "Oracle 이 빠지면 DB 장애(F35-R, F01-P 계열)다. 이 주입은 Oracle 을 건드리지 않는다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "transfer-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "baseline-transfers-recovered",
              "observation": "transfer_5xx_rate_baseline",
              "op": "lt",
              "value": 0.05,
              "_note": "판정력을 가진 회복 조건. 평시 0.0, 고장 중 약 1.0(기준선 이체도 nginx → api → account 를 탄다). 30초 창 이체 약 3건이라 5xx 가 한 건만 있어도 0.25 이상이 되어 통과하지 못한다"
            },
            {
              "id": "baseline-balance-recovered",
              "observation": "balance_read_nonok_rate_baseline",
              "op": "lt",
              "value": 0.05,
              "_note": "상주 기준선의 잔액 조회(nginx → account 직행)도 실패 없이 돌아와야 회복이다. 고장 중 약 1.0"
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 replicas 를 1 로 되돌리고 새 account 파드가 available 이 될 때까지(기동 약 40초, 상한 180초) 기다린 뒤, 기준선 이체와 잔액 조회가 30초 창 두 번 연속 실패 없이 끝나야 회복이다. target_health 와 pod_ready 는 compile-plan 이 요구하는 형식 조건이고 고장 중에도 참이다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "k8s.scale",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "k8s.scale",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "k8s.scale"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
