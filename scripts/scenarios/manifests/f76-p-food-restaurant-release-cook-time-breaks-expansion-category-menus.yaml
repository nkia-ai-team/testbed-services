        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "_note": "food 진입점(동반 부하 k6 의 order 와 restaurant NodePort, tb-cp 30180, 30181) 상태. 릴리스 1.7.0 은 restaurant 의 메뉴 응답 GET /api/restaurants/{id}/menu 에서만, 그것도 조리 시간 표에 없는 카테고리의 메뉴를 담을 때만 몇 ms 안에 500 을 내고 health, 가게 상세, 목록, 인기 메뉴는 그대로라 restaurant NodePort 는 응답한다. k6 주문 여정은 메뉴 조회(menu-lookup)가 200 일 때만 주문을 보내므로 order 는 정상 가게의 주문만 받고 그 가게의 메뉴는 200 이다(로컬 실측: 가게 16 주문은 메뉴 해석을 지나 용량 확인 단계까지 갔다). 0(연결 불가)은 노드나 order, restaurant 파드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "menu_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "freshness": "30s",
            "_note": "동반 부하(food surge.js 3rps, 45% 가 가게 둘러보기: 상세 → 메뉴 → 30% 인기 메뉴)의 메뉴 단계(step menu) 4xx+5xx 비율(60초 창). 평시 0 근처(119 restaurant 서버 스팬 GET /api/restaurants/{id}/menu 1일 표본 29,243건 모두 200). k6 는 가게를 3/23 확률로 1~3(데모 시드, 카테고리 1~3), 나머지는 16~35 에서 고르는데 109 food MySQL menus 의 카테고리가 가게마다 하나이고(1 + id % 8) 19~23, 27~31, 35 의 11곳이 카테고리 4~8 이다. 릴리스 1.7.0 은 그 11곳의 메뉴를 모두 500 으로 답하므로 메뉴 단계 실패 비율은 약 11/23 = 0.48 이다(로컬 실측: 같은 소스 jar, 같은 init.sql 의 MySQL 8.0 에서 가게 1~3, 16~18, 24~26, 32~34 메뉴 200, 나머지 11곳 500, 상세와 인기 메뉴는 23곳 모두 200)"
          },
          {
            "id": "restaurant_pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-restaurant"
            },
            "freshness": "30s",
            "_note": "restaurant 파드. 릴리스는 기동과 /actuator/health 를 바꾸지 않아 새 파드가 Ready 가 되고 그대로 머문다(예외는 메뉴 응답을 만들 때만 난다). 롤아웃 순간에는 새 파드와 옛 파드가 겹치므로 배제 조건에는 연속 2틱으로 둔다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-mysql"
            },
            "freshness": "30s",
            "_note": "food MySQL 파드. 릴리스는 질의를 바꾸지 않는다(같은 메뉴 질의 뒤 응답 변환에서 실패). 빠지면 DB 장애(F25-H 꼴)다"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
