            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "freshness": "30s",
            "_note": "기록만 한다. 동반 부하 주문 생성 단계 5xx 비율. k6 가 메뉴 조회에 성공한 가게(카테고리 1~3)의 주문만 보내므로 릴리스와 무관하게 평소대로여야 한다. 배달원 용량(2000)이 차는 한낮에는 503 이 섞일 수 있어 판정 조건에 쓰지 않는다"
          },
          {
            "id": "menu_nonok_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "food-delivery"
            },
            "freshness": "30s",
            "_note": "기록만 한다. 상주 기준선(loadgen-food)의 메뉴 단계 4xx+5xx 비율. 기준선도 같은 가게 고르기라 약 0.48 로 오른다"
          }
        ],
        "success": {
          "all": [
            {
              "id": "expansion-category-menus-failing",
              "observation": "menu_nonok_rate",
              "op": "gte",
              "value": 0.25,
              "_note": "릴리스 1.7.0 의 RestaurantService.toMenuResponse 는 메뉴마다 카테고리별 예상 조리 시간을 COOK_MINUTES_BY_CATEGORY(1 분식 10, 2 중식 15, 3 치킨 20 세 개뿐)에서 꺼내 int 로 받는데, 표에 없는 카테고리면 Map.get 이 null 을 돌려 자동 언박싱에서 NullPointerException('Cannot invoke \"java.lang.Integer.intValue()\" because the return value of \"java.util.Map.get(Object)\" is null')이 나고 Tomcat 이 SEVERE 'Servlet.service() ... threw exception [Request processing failed: java.lang.NullPointerException: ...]' 를 남기며 500 을 준다. 데모 시드(가게 1~3, 카테고리 1~3)에서는 실패하지 않는다. 메뉴 목록은 응답 전체가 실패하므로 카테고리 4~8 가게 11곳의 메뉴가 모두 500 이고, 가게 상세, 목록 검색, 인기 메뉴, 나머지 가게 메뉴는 정상이다. 기대 실패 비율 약 0.48, 문턱 0.25 는 그 절반 남짓이다. 결정적 결함이라 강도 사다리가 없다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 8m: 롤아웃(새 restaurant 파드 기동 약 40초~1분, 기본 전략 maxSurge 25% 라 새 파드가 Ready 가 된 뒤 옛 파드가 내려감), 동반 부하 ramp 2m. 실패는 새 파드가 트래픽을 받는 즉시 시작되고 강도가 시간에 따라 바뀌지 않는다. timeout 14m"
        },
