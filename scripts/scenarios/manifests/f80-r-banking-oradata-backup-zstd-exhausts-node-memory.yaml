{
  "schema_version": "1.0",
  "id": "F80-R",
  "slug": "f80-r-banking-oradata-backup-zstd-exhausts-node-memory",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "worker-w2",
    "matrix_location_transport": "R/ssh tb-w2 sudo systemd-run --unit=oradata-backup --collect --property=Nice=10 --property=IOSchedulingClass=idle --property=RuntimeMaxSec=600 /bin/sh -c 'mkdir -p /var/backups/oradata && cd <PVC oracledata-testbed-oracle-0 의 PV 디렉터리> && { users01.dbf 를 뺀 FREE 의 tar 출력을 파이프로 zstd -q -12 --long=31 -T1 -o oradata-<날짜>.tar.zst & zstd -q -12 --long=31 -T1 -o users01-<날짜>.dbf.zst FREE/FREEPDB1/users01.dbf; wait; }'(preflight: MemAvailable 1,536~3,584 MiB 일 때만) + R/ssh load.north_south core-banking transfer-heavy-surge.js 5rps companion",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/host.job",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "host-placement-and-oob-recovery",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "host.job",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "host.job"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "20m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f80-r",
              "parameters": {
                "host": "192.168.122.11",
                "node": "tb-w2",
                "namespace": "rca-testbed-banking",
                "pvc": "oracledata-testbed-oracle-0",
                "source": "FREE",
                "largest_file": "FREE/FREEPDB1/users01.dbf",
                "largest_min_mib": 2048,
                "unit": "oradata-backup",
                "description": "Oracle datafile backup",
                "output_dir": "/var/backups/oradata",
                "level": 12,
                "long_window_log": 31,
                "nice": 10,
                "runtime_seconds": 600,
                "min_free_mib": 20480,
                "min_available_mib": 1536,
                "max_available_mib": 3584,
                "deployments": [
                  "testbed-nginx",
                  "testbed-api",
                  "testbed-account",
                  "testbed-transfer",
                  "testbed-ledger"
                ],
                "statefulsets": [
                  "testbed-oracle"
                ]
              },
              "min_hold": "3m",
              "settle": "30s",
              "timeout": "10m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "core-banking"
            },
            "freshness": "15s",
            "_note": "기준선 문서의 이체 단계(nginx → api) 상태. api, account, transfer 가 축출되거나 커널 OOM 으로 죽어도 nginx 가 502 로 답하므로 0(연결 불가)은 nginx 나 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s",
            "_note": "러너 고정 대상(commerce 진입점 30080/health)이라 banking 고장과 무관하다. compile-plan 이 recovery 에 target_health==200 을 요구해서 둔다. 판정력은 없다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-transfer"
            },
            "freshness": "30s",
            "_note": "transfer 파드. 회복 조건에 쓴다"
          },
          {
            "id": "oracle_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-oracle"
            },
            "freshness": "30s",
            "_note": "Oracle 파드. 노드 메모리가 마르면 요청량(2Gi)을 넘겨 쓰는 유일한 파드라 kubelet 축출의 첫 대상이다(설계 시트 §9). 빠지는 것은 예상 전파라 배제 조건에 쓰지 않고 회복 조건에 쓴다"
          },
          {
            "id": "transfer_available_replicas",
            "adapter": "kubernetes",
            "query_id": "kubernetes.deployment_available_replicas",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "deployment": "testbed-transfer"
            },
            "freshness": "30s",
            "_note": "평시 1. 회복 조건에 쓴다"
          },
          {
            "id": "node_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.node_ready",
            "parameters": {
              "node": "tb-w2"
            },
            "freshness": "30s"
          },
          {
            "id": "node_mem_util",
            "adapter": "prometheus",
            "query_id": "prometheus.node_memory_utilization",
            "parameters": {
              "node": "tb-w2"
            },
            "freshness": "60s",
            "_note": "기록용. KCM 노드 에이전트가 압박의 희생자가 되면 값이 얼어붙으므로(F05-P 2026-08-20 실측) 판정에 쓰지 않는다. 판정 근거의 메모리 증거는 SMS 호스트 지표에 남는다"
          },
          {
            "id": "transfer_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "freshness": "30s",
            "_note": "동반 부하 이체(step transfer, nginx → api → account → transfer → Oracle) 5xx 비율. 질의 이름은 food 지만 선택자는 도메인 공통 business.5xx.rate 다. 평시 업무 거절은 400(잔액 부족)이라 5xx 는 0"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "transfer_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "parameters": {
              "domain": "core-banking"
            },
            "freshness": "30s",
            "_note": "상주 기준선(loadgen-banking)의 이체 5xx 비율. 평시 0. 회복 판정에 쓴다"
          }
        ],
        "success": {
          "all": [
            {
              "id": "transfers-failing-5xx",
              "observation": "transfer_5xx_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "백업 작업의 두 압축 흐름(users01.dbf 하나, 나머지 디렉터리 tar 하나, 각각 zstd -12 --long=31)이 창을 채우며 합계 약 4.6 GiB 를 쥐어 tb-w2 여유(66 이전 뒤 2,257~2,904 MiB)를 넘는다. kubelet 이 요청량을 넘긴 Oracle 을 축출하거나 커널이 oom 점수가 높은 프로세스(KCM 노드 에이전트, banking 자바 컨테이너)를 죽인다. Oracle 이나 자바 서비스가 빠지면 이체 경로(api → account → transfer → Oracle)가 끊겨 api 가 502 로 답하고, 작업이 도는 동안 다시 뜬 Oracle 도 같은 메모리 부족을 만난다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 3m: 실제 파일 실측으로 users01 흐름 12.7 MB/s, 나머지 tar 흐름 21.5 MB/s 라 두 흐름 합계(초당 약 33 MiB 증가)가 여유(66 이전 뒤 p50 2,700 MiB)를 넘는 것이 시작 뒤 약 85초, 나머지 흐름이 창을 채운 뒤 끝나는 것이 약 183초(그때 합계 약 4.6 GiB), users01 흐름 혼자 약 2.3 GiB 로 약 420초까지 간다(RuntimeMaxSec 600). 약 85~183초에 Oracle 이 축출되거나 자바 컨테이너가 죽고, 그사이 다시 뜬 파드도 메모리가 모자라며, 압박이 풀린 뒤에도 Oracle 인스턴스 복구나 자바 기동(95~130초)이 붙어 약 4~5분까지 이체가 실패한다. 3분이면 그 피해 구간 안에서 판정된다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1.25,
              "_note": "동반 부하 5rps 의 1/4. 부하가 실제로 끊겼을 때만 발화한다"
            }
          ],
          "consecutive_ticks": 2,
          "_note": "oracle-down 배제는 두지 않는다. 노드 메모리가 마를 때 kubelet 축출의 첫 대상이 요청량을 넘겨 쓰는 Oracle 이라 Oracle 이 빠지는 것이 이 시나리오의 예상 전파다. Oracle 자체 장애(F25-H, F35-R)와는 정답지의 노드 메모리 증거(SMS 메모리 사용률과 프로세스 목록의 zstd, KCM SystemOOM 이나 노드 메모리 축출, 빠진 파드의 메모리가 자기 한도 아래)로 가른다"
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            },
            {
              "id": "node-notready-total-collapse",
              "observation": "node_ready",
              "op": "eq",
              "value": false
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "transfer-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "transfer-replica-recovered",
              "observation": "transfer_available_replicas",
              "op": "eq",
              "value": 1
            },
            {
              "id": "oracle-ready",
