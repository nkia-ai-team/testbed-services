            },
            {
              "id": "baseline-transfers-recovered",
              "observation": "transfer_5xx_rate_baseline",
              "op": "lt",
              "value": 0.05,
              "_note": "판정력을 가진 회복 조건. 평시 0.0"
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "15m",
          "_note": "cleanup 이 백업 유닛을 멈추고 그것이 쓴 백업 파일 둘만 지운 뒤 banking 워크로드가 모두 준비될 때까지(최대 420초) 기다린다. 축출된 Oracle 은 StatefulSet 이 다시 만들고 인스턴스 복구 뒤 준비된다. target_health 는 compile-plan 이 요구하는 형식 조건이라 판정력이 없다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
