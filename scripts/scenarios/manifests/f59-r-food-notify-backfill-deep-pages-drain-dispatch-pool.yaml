{
  "schema_version": "1.0",
  "id": "F59-R",
  "slug": "f59-r-food-notify-backfill-deep-pages-drain-dispatch-pool",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "food namespace",
    "matrix_location_transport": "K/kubectl food Job notify-delivery-backfill apply(workers=12, page_size=500, pages_per_worker=290, activeDeadlineSeconds 1800) + R/ssh load.north_south companion(food-delivery order-surge.js, target_rps=2, 하루 주기 1~6 iter/s 기준선 위 주문 표본 고정)",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/k8s.job",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "east-west-job-contract",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "k8s.job",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "k8s.job"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "25m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f59-r",
              "parameters": {
                "namespace": "rca-testbed-food",
                "job": "notify-delivery-backfill",
                "image": "food-delivery-notify:latest",
                "image_owner": "testbed-notify",
                "node": "tb-w3",
                "target_deployment": "testbed-dispatch",
                "target_url": "http://testbed-dispatch:8082",
                "status": "DELIVERED",
                "page_size": 500,
                "workers": 12,
                "pages_per_worker": 290,
                "request_timeout_seconds": 60,
                "active_deadline_seconds": 1800
              },
              "min_hold": "12m",
              "settle": "60s",
              "timeout": "20m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "_note": "food 진입점(동반 부하 k6 의 order 와 restaurant NodePort, tb-cp 30180, 30181) 상태. 백필은 클러스터 안 Job 파드에서 testbed-dispatch Service 로 바로 들어가 진입점을 지나지 않는다. order 는 dispatch 호출이 실패하면 재시도와 서킷브레이커 끝에 503 을 돌려주므로(F33-R 녹화: entry_status 503, 500, 200 섞임, order 재시작 없음) 0(연결 불가)은 노드나 order 파드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-mysql"
            },
            "freshness": "30s",
            "_note": "food MySQL 파드. 백필은 MySQL 을 포화시키지만 재시작시키지 않는다(F33-R 녹화와 같은 포화 꼴에서 전 구간 True)"
          },
          {
            "id": "order_create_2xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "_note": "동반 부하(order-surge.js 2rps)의 k6 live 문서. 상주 기준선(loadgen-food)은 하루 주기로 주문 생성이 초당 약 0.2~1.2건이라(119 'Created order' 로그 2026-10-10 11~17시 UTC 시간당 604~2,877건) 동반 부하가 시간대와 무관하게 주문(용량 확인)을 초당 약 1.4건 더해 러너 표본과 order 의 실패 로그를 고정한다(F33-R 과 같은 값)",
            "freshness": "30s"
          },
          {
            "id": "order_create_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "freshness": "30s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "order_create_2xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "parameters": {
              "domain": "food-delivery"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "order-create-failed-5xx",
              "observation": "order_create_5xx_rate",
              "op": "gte",
              "value": 0.5
            },
            {
              "id": "order-create-collapsed",
              "observation": "order_create_2xx_rate",
              "op": "lt",
              "value": 0.2
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 12m. 백필 파드가 뜨고 워커 12개가 깊은 페이지를 부르기 시작하면(109 실측 offset 20만 0.53초, 100만 6.3초, 한가할 때) dispatch Hikari 연결 10개가 모두 백필 질의에 묶여, 주문마다 필요한 용량 확인과 배차 요청이 연결을 3초 기다리다 500 이 되고 order 가 재시도와 서킷브레이커 끝에 503 을 낸다. 포화 꼴이 같은 F33-R 녹화(호출당 약 3.7초 전수 스캔이 주문마다)에서 5xx 0.68~0.88, 2xx 0.09~0.26 으로 같은 조건을 3틱 맞췄다. 여기서는 풀을 쥐는 호출 수가 주문 수와 무관하게 워커 수(12 > 풀 10)로 정해져 시간대에 덜 좌우된다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 0.5,
              "_note": "동반 부하 2rps 의 1/4. order-surge.js 는 ramping-arrival-rate(maxVUs 기본 300)라 실패 여정이 재시도로 최대 약 15초 걸려도 동시 VU 약 30 으로 반복률이 유지된다. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "food-db-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false
            }
          ],
          "consecutive_ticks": 2,
          "_note": "dispatch 파드 준비 상태와 서버 스팬 오류율은 러너 관측 허용 목록(APPROVED_K8S_TARGETS, APPROVED_APM_SERVICES)에 없어 러너 배제 조건으로 두지 않는다(F33-R, F58-R 과 같음). 인덱스, 롤아웃, 설정 변경이 아니라는 감별은 녹화된 KCM, DPM, 로그로 RCA 쪽에서 한다(정답지 must_support, must_rule_out)"
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "db-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "create-recovered",
              "observation": "order_create_2xx_rate_baseline",
              "op": "gte",
              "value": 0.7
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 Job 을 foreground 로 지우고 백필 파드가 없어진 뒤 testbed-dispatch 가 사용 가능해질 때까지 기다린다. 파드가 사라질 때 진행 중이던 깊은 페이지 질의는 dispatch 쪽에서 끝까지 돈 뒤(1분 안팎) 연결을 돌려준다. 백필은 읽기만 하므로 남는 데이터가 없다(받은 페이지는 파드의 emptyDir 와 함께 사라진다)"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "15m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "k8s.job",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "k8s.job",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "k8s.job"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
