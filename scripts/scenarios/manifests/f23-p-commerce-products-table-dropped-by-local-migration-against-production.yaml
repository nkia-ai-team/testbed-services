{
  "schema_version": "1.0",
  "id": "F23-P",
  "slug": "f23-p-commerce-products-table-dropped-by-local-migration-against-production",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh db.ddl commerce testbed-postgres-0 PostgreSQL 표 지우기(kubectl exec psql 앱 계정, PGOPTIONS pg_stat_statements.track=none 세션: ALTER TABLE product_schema.products SET SCHEMA public(lock_timeout 10s) 뒤 옮긴 표와 인덱스 셋의 통계 카운터를 pg_stat_reset_single_table_counters 로 0 으로, 실제 지우기처럼 DPM 이 합산하는 seq_scan, idx_scan 합에서 빠지게 함. 행, 인덱스, 소유 시퀀스, 외래 키는 옮긴 원본을 따라감) + R/ssh load.north_south companion(commerce surge.js, target_rps=3, 여정 절반이 checkout, 진입 nginx 30080)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.ddl",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "db-inverse-ddl-ready",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "db.ddl",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "db.ddl"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "25m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f23-p",
              "parameters": {
                "engine": "postgresql",
                "namespace": "rca-testbed-commerce",
                "db_pod": "testbed-postgres-0",
                "schema": "product_schema",
                "table": "products",
                "hold_schema": "public",
                "minimum_rows": 1000
              },
              "min_hold": "15m",
              "settle": "30s",
              "timeout": "20m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "_note": "commerce 진입점(nginx 30080 → gateway). 표 지우기는 파드와 nginx, gateway 를 건드리지 않아 gateway 가 product 의 500 과 order 의 502 를 그대로 돌려준다. 0(연결 불가)은 nginx, gateway 나 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s",
            "_note": "러너 고정 대상(commerce 진입점 30080/health). gateway health 는 product 와 무관해 내내 200 이다. compile-plan 이 recovery 에 target_health==200 을 요구해서 둔다"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-product"
            },
            "freshness": "30s",
            "_note": "product 파드. health 가 DB 연결 확인뿐이라 표가 없어도 Ready 다(로컬 실측 /actuator/health UP). 빠지면 표가 아니라 product 자체가 빠진 다른 장애다. product 는 기동 때 spring.sql.init(mode always)로 schema.sql 의 CREATE TABLE IF NOT EXISTS product_schema.products 와 data.sql 의 상품 16개를 넣으므로 창 안 재시작은 다른 장애 꼴이 된다. 재시작하면 Spring 기동 동안 NotReady 가 30초를 넘어 product-pod-gone(2틱)으로 배제되고, 그 뒤 flagship 상품(1~16) checkout 이 되살아나 성공 조건(checkout 2xx<0.3)도 서지 않는다. cleanup 은 다시 생긴 거의 빈 표(1000행 미만, 참조 없음)를 지운 뒤 원본을 되돌린다(로컬 실측). 러너의 컨테이너 재시작 관측 허용 목록에 product 가 없어 재시작 수는 따로 관측하지 않는다(평시 2026-10-10 109 재시작 0회, 40일)"
          },
          {
            "id": "postgres_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s",
            "_note": "commerce PostgreSQL 파드. 표 하나를 옮기고 그 통계 카운터를 0 으로 돌리는 주입은 인스턴스를 건드리지 않아 내내 Ready 여야 한다. 빠지면 표가 아니라 DB 다운(F25-H 꼴)이다"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s",
            "_note": "동반 부하(commerce surge.js 3rps, 여정 절반이 checkout)의 checkout 5xx 비율. checkout 은 장바구니 담기(cart, product 를 부르지 않음) 뒤 order 가 cart, pricing 을 거쳐 품목마다 product reserve-stock 을 부른다. 표가 없으면 product 가 findById 에서 42P01 로 500 을 즉시 내고, order 의 productClient 가 200ms, 400ms 재시도 뒤 서킷 끝에 502 'Product service unavailable for product N' 을 던져 checkout 이 결제 전에 502 로 끝난다. 평시 checkout 5xx 는 0 근처(409 재고 부족, 400 쿠폰은 업무 거절)"
          },
          {
            "id": "checkout_2xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "freshness": "30s"
          },
          {
            "id": "checkout_nonok_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.write_step_status_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s",
            "_note": "상주 기준선(loadgen-commerce)의 쓰기 단계 실패율. 동반 부하가 끝난 뒤 회복 판정에 쓴다"
          }
        ],
        "success": {
          "all": [
            {
              "id": "checkout-failed-5xx",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.5
            },
            {
              "id": "checkout-collapsed",
              "observation": "checkout_2xx_rate",
              "op": "lt",
              "value": 0.3
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 15m. 표가 사라진 순간부터 product 의 products 문장이 모두 42P01 'relation \"product_schema.products\" does not exist' 로 실패한다(로컬 실측: 목록, 변형, reserve-stock 모두 500, 실행 중 요청 400건 중 166건이 run 뒤 500, run 0.9초, cleanup 0.6초). checkout 은 결제 전 재고 예약 단계에서 전량 502 이고 성공이 없다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1,
              "_note": "동반 부하 3rps 의 1/3. 실패가 즉시 나서 여정이 짧아질 뿐 반복률은 유지된다(ramping-arrival-rate). 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "commerce-db-down",
              "observation": "postgres_ready",
              "op": "eq",
              "value": false,
              "_note": "PostgreSQL 이 빠지면 표가 아니라 DB 다운(F25-H 꼴)이다"
            },
            {
              "id": "product-pod-gone",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "product 파드가 빠지면 표가 아니라 product 자체가 빠진 장애다. 창 안 재시작도 기동 동안 NotReady 로 여기서 배제된다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "product-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "db-ready",
              "observation": "postgres_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "writes-recovered",
              "observation": "checkout_nonok_rate_baseline",
              "op": "lt",
              "value": 0.1
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 이 pg_stat_statements 가 기록하지 않는 세션에서 public.products 를 product_schema 로 되돌린다(행, 인덱스 셋, id 시퀀스, product_variants 의 외래 키가 함께 돌아옴. 스캔 카운터는 백업 복원 뒤처럼 0 에서 다시 센다). order 의 productClient 서킷은 5초 뒤 반열림 3회 성공으로 닫힌다. 실패한 checkout 은 결제 전 단계라 주문, 결제, 정산 이체를 남기지 않는다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "5m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "db.ddl",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "db.ddl",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "db.ddl"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
