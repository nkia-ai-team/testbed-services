{
  "schema_version": "1.0",
  "id": "F66-P",
  "slug": "f66-p-commerce-inventory-outbox-column-migration-queues-behind-event-export",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh db.ddl commerce testbed-postgres-0 내보내기 COPY(outbox_events 자기 행, 행 추정/420 행마다 1초 쉬는 읽기 쪽, 행 추정 42,000 미만이면 시작 안 함) + ALTER TABLE inventory_schema.outbox_events ADD COLUMN trace_id varchar(64)(kubectl exec psql 을 DB 파드 안에서 백그라운드로, 내보내기 잠금 확인 뒤 마이그레이션을 띄우고 내보내기 뒤에서 기다리는 것이 보이면 run 종료, 두 세션 application_name 'PostgreSQL JDBC Driver', 탐침은 pg_stat_statements 기록 안 함, preflight 가 행 10,000 이상, 열 없음, 두 세션 없음, lock_timeout·statement_timeout 0, 그 표 대기 잠금 0, 열린 세션 ≤70) (동반 부하 없음, 상주 commerce 기준선이 트래픽을 냄)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.ddl"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "db-inverse-ddl-ready"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "db.ddl",
        "companion_refs": [],
        "approved_profile_id": "db.ddl"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "20m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f66-p",
              "parameters": {
                "engine": "postgresql",
                "namespace": "rca-testbed-commerce",
                "db_pod": "testbed-postgres-0",
                "schema": "inventory_schema",
                "table": "outbox_events",
                "add_column": "trace_id",
                "add_column_type": "varchar(64)",
                "export_columns": "id, aggregate_type, aggregate_id, event_type, topic, payload, created_at, published_at",
                "export_seconds": 420,
                "drain_seconds": 300,
                "minimum_rows": 10000,
                "maximum_sessions": 70
              },
              "min_hold": "3m",
              "settle": "30s",
              "timeout": "7m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "parameters": {
              "domain": "commerce"
            },
            "_note": "상주 기준선(loadgen-commerce)의 마지막 checkout 응답 상태. 동반 부하가 없다. 게이트웨이(30080)는 DB 를 쓰지 않고, checkout 은 order 읽기 시간 제한(15초) 안에 5xx 로 끝나며 product 경로는 게이트웨이 서킷이 열리면 곧바로 502 다. 0(연결 불가)은 게이트웨이나 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-inventory"
            },
            "freshness": "30s",
            "_note": "inventory-service 는 /actuator/health 에 DB 확인이 들어 있어, 예약 트랜잭션이 outbox INSERT 에서 멈춰 Hikari 풀(10)을 쥐면 readiness 가 빠지고 liveness(15초 x 5)가 재시작한다. 다시 뜬 파드는 기동 schema.sql 의 CREATE INDEX IF NOT EXISTS(이동 이력 표, outbox 표)가 같은 잠금 뒤에 서서 잠금이 풀릴 때까지 뜨지 못한다(startupProbe 5초 x 60 = 300초를 넘기면 다시 시작한다). 증상이라 배제 조건에 넣지 않고 복구 확인에만 쓴다"
          },
          {
            "id": "postgres_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-postgres"
            },
            "freshness": "30s",
            "_note": "commerce PostgreSQL. 이 주입은 프로세스, 설정, 자원을 바꾸지 않는다(세션 둘과 열 하나). Ready 가 빠지면 표 하나의 잠금 대기열이 아니라 DB 다운(F25-H 꼴)이다"
          },
          {
            "id": "blocked_db_sessions",
            "adapter": "database",
            "query_id": "database.blocked_session_count",
            "parameters": {
              "schema": "inventory_schema",
              "table": "inventory"
            },
            "freshness": "30s",
            "_note": "재고 표에 잠금을 가진 채 막힌 세션 수(pg_blocking_pids 가 비지 않음). 줄 선 예약 트랜잭션은 재고 행을 FOR UPDATE 로 잡은 뒤 outbox INSERT 에서 기다리므로 재고 표의 잠금을 쥔 막힌 세션으로 잡히고, 같은 상품의 다음 예약은 그 행 잠금을 기다려 잡힌다. 평시 0. 이 값은 러너 판정에만 쓰고 정답(outbox 표)을 가리키지 않는다"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s",
            "parameters": {
              "domain": "commerce"
            }
          },
          {
            "id": "checkout_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s",
            "parameters": {
              "domain": "commerce"
            },
            "_note": "상주 기준선(loadgen-commerce, 하루 주기 2~10rps, 여정의 8% 가 checkout)의 checkout 단계. 로그인(users)과 장바구니는 막히지 않아 checkout 여정이 모두 checkout 까지 가고, checkout 은 order 의 product 예약 호출(product → inventory)이 inventory 풀 고갈로 실패해 5xx 다. 30초 창마다 약 5~24건이 표본이다"
          },
          {
            "id": "checkout_2xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "freshness": "30s",
            "parameters": {
              "domain": "commerce"
            }
          },
          {
            "id": "write_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.write_step_status_rate",
            "freshness": "30s",
            "parameters": {
              "domain": "commerce"
            }
          }
        ],
        "success": {
          "all": [
            {
              "id": "checkout-failed-5xx",
              "observation": "checkout_5xx_rate_baseline",
              "op": "gte",
              "value": 0.5
            },
            {
              "id": "checkout-collapsed",
              "observation": "checkout_2xx_rate_baseline",
              "op": "lt",
              "value": 0.3
            },
            {
              "id": "reservations-stuck",
              "observation": "blocked_db_sessions",
              "op": "gte",
              "value": 1
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 3m, 3틱. run 이 내보내기(약 420초 동안 활성)를 띄우고 그 잠금이 잡힌 것을 본 뒤 마이그레이션을 띄워, 서버가 마이그레이션을 내보내기 뒤에서 기다리는 것으로 보이면 돌아온다(로컬 실측 2.0초). 그 순간부터 outbox 에 쓰는 예약 트랜잭션이 재고 행 잠금과 연결을 쥔 채 멈추고 inventory 풀이 로컬 실측 15초 안에 찬다. min_hold 3m 은 inventory 의 liveness 재시작과 기동 실패 고리가 녹화에 담기게 하려는 것이다(로그인 경로가 막히지 않아 F66-R 처럼 표본이 사라질 걱정이 없다). 판정 관측은 30초마다 갱신돼 min_hold 뒤 약 90초에 3틱이 찬다. 성공 뒤 cleanup 이 내보내기가 스스로 끝나기를 기다리므로(drain 300초) 녹화에는 잠금 대기열 전체(약 7분)와 스스로 풀리는 모습이 담긴다. timeout 7m 은 내보내기가 끝나는 시각이다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 1,
              "_note": "기준선 2~10rps. 서킷이 열리기 전 약 10~20초 동안 요청이 매달려 VU(최대 50)가 모자라도 약 2.5rps 아래로는 떨어지지 않는다. 부하 자체가 끊겼을 때만 발화한다"
            },
            {
              "id": "commerce-db-down",
              "observation": "postgres_ready",
              "op": "eq",
              "value": false,
              "_note": "PostgreSQL 이 죽거나 재시작하면 F25-H 꼴이다. 이 시나리오에서 PostgreSQL 은 Ready 로 남고 한 표의 쓰기만 줄을 선다"
            }
          ],
          "consecutive_ticks": 2,
          "_note": "상품 목록 실패율은 배제 조건으로 쓰지 않는다: 게이트웨이 product 서킷이 상세(재고 조회)와 목록을 함께 묶어 이 시나리오에서는 목록도 502 가 된다(F66-R 과 다른 점)"
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "inventory-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "db-ready",
              "observation": "postgres_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "no-stuck-reservations",
              "observation": "blocked_db_sessions",
              "op": "eq",
              "value": 0
            },
            {
              "id": "writes-recovered",
              "observation": "write_nonok_rate",
              "op": "lt",
              "value": 0.1
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "내보내기가 끝나면 마이그레이션이 잠금을 얻어 열을 더하고(카탈로그만, 즉시) 줄 선 쓰기가 모두 풀린다. 재시작 중이던 inventory 는 기동 문장이 끝나 곧 Ready 가 된다(로컬 실측). 재시작 고리에서 CrashLoopBackOff 지연(최대 수 분)이 남을 수 있어 timeout 10m 이다. cleanup 은 그 뒤 더해진 열을 지운다(카탈로그만)"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "12m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
