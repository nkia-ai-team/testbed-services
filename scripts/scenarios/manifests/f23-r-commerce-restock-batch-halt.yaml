                  },
                  {
                    "name": "OTEL_SERVICE_NAME",
                    "value": "commerce-inventory"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://192.168.230.119:14317"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_PROTOCOL",
                    "value": "grpc"
                  },
                  {
                    "name": "OTEL_RESOURCE_ATTRIBUTES",
                    "value": "lucida.groupId=commerce,lucida.target_id=414db206-d121-43b1-886c-78b240d23a7a"
                  },
                  {
                    "name": "OTEL_TRACES_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRICS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_LOGS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRIC_EXPORT_INTERVAL",
                    "value": "10000"
                  }
                ],
                "fault": [
                  {
                    "name": "DB_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "POSTGRES_USER",
                        "name": "postgres-secret"
                      }
                    }
                  },
                  {
                    "name": "DB_PASS",
                    "valueFrom": {
                      "secretKeyRef": {
                        "key": "POSTGRES_PASSWORD",
                        "name": "postgres-secret"
                      }
                    }
                  },
                  {
                    "name": "JAVA_TOOL_OPTIONS",
                    "value": "-javaagent:/opt/apm/opentelemetry-javaagent.jar"
                  },
                  {
                    "name": "OTEL_SERVICE_NAME",
                    "value": "commerce-inventory"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_ENDPOINT",
                    "value": "http://192.168.230.119:14317"
                  },
                  {
                    "name": "OTEL_EXPORTER_OTLP_PROTOCOL",
                    "value": "grpc"
                  },
                  {
                    "name": "OTEL_RESOURCE_ATTRIBUTES",
                    "value": "lucida.groupId=commerce,lucida.target_id=414db206-d121-43b1-886c-78b240d23a7a"
                  },
                  {
                    "name": "OTEL_TRACES_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRICS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_LOGS_EXPORTER",
                    "value": "otlp"
                  },
                  {
                    "name": "OTEL_METRIC_EXPORT_INTERVAL",
                    "value": "10000"
                  },
                  {
                    "name": "SPRING_APPLICATION_JSON",
                    "value": "{\"inventory\":{\"reconciliation\":{\"interval-ms\":999999999}}}"
                  }
                ]
              },
              "min_hold": "12m",
              "settle": "30s",
              "timeout": "18m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-inventory"
            },
            "freshness": "30s"
          },
          {
            "id": "checkout_409_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_409_rate",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s"
          },
          {
            "id": "stock_zero_count",
            "adapter": "database",
            "query_id": "database.inventory_stock_level",
            "parameters": {
              "db_host": "192.168.122.77",
              "db_port": 30432,
              "db_name": "commerce",
              "db_user": "commerce",
              "schema": "inventory_schema",
              "table": "inventory"
            },
            "freshness": "30s"
          },
          {
            "id": "restock_movement_count",
            "adapter": "database",
            "query_id": "database.restock_movement_rate",
            "parameters": {
              "db_host": "192.168.122.77",
              "db_port": 30432,
              "db_name": "commerce",
              "db_user": "commerce",
              "schema": "inventory_schema",
              "table": "inventory_movements",
              "movement_type": "RESTOCK",
              "window_minutes": 5
            },
            "freshness": "60s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "checkout-409-up",
              "observation": "checkout_409_rate",
              "op": "gte",
              "value": 0.3
            },
            {
              "id": "stock-depleted",
              "observation": "stock_zero_count",
              "op": "gte",
              "value": 1
            }
          ],
          "consecutive_ticks": 3
        },
        "must_rule_out": {
          "any": [
            {
              "id": "checkout-5xx-elevated",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.05
            },
            {
              "id": "inventory-unready",
              "observation": "pod_ready",
              "op": "eq",
              "value": false
            },
            {
              "id": "restock-still-running",
              "observation": "restock_movement_count",
              "op": "gt",
              "value": 0,
              "_note": "룩백 창 12m → 5m. 이 값은 감별력을 깎는 완화가 아니라 배치 주기에 맞춘 재척도다 — 12분은 종전 주기 10분에 맞춰 잡힌 값이었고, 2026-08-07에 주기가 60초로 바뀌면서 낡은 척도가 됐다. 5분은 새 주기의 5배라 배치가 계속 돌고 있으면 창 안에 ~5개 행이 들어오므로 '정지 명령이 먹지 않았다'를 여전히 넉넉히 잡는다. 줄이지 않으면 오히려 오발화한다: 주기 60초에서는 주입 직전과 k8s.env 롤아웃 중(구 파드가 수십 초 더 산다)에 RESTOCK 행이 거의 확실히 쓰이고, t=+60s 행은 12분 창에서 t=13m까지 남는다. 판정은 min_hold 12m에 열리므로 그 행 하나가 15초 틱 5개를 덮어 3연속 요건을 넘겨 실격시킨다. 5분이면 t≤+60s 행이 6분에 창을 빠져나가 판정 시작까지 5.5분 여유가 생긴다. 주기·min_hold·이 창은 함께 움직여야 한다(ReconciliationBatch javadoc의 제약 3항)."
            }
          ],
          "consecutive_ticks": 3
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "restock-resumed",
              "observation": "restock_movement_count",
              "op": "gt",
              "value": 0
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
