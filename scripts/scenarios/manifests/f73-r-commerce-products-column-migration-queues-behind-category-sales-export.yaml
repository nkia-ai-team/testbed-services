  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh db.ddl commerce testbed-postgres-0 내보내기 COPY(order_items 에 products 를 이은 매출 줄, order_items 행 추정/360 행마다 1초 쉬는 읽기 쪽, 행 추정 36,000 미만이면 시작 안 함) + ALTER TABLE product_schema.products ADD COLUMN brand varchar(100)(kubectl exec psql 을 DB 파드 안에서 백그라운드로, 내보내기의 products 잠금 확인 뒤 마이그레이션을 띄우고 내보내기 뒤에서 기다리는 것이 보이면 run 종료, 두 세션 application_name 'PostgreSQL JDBC Driver', 탐침은 pg_stat_statements 기록 안 함, preflight 가 products 행 1,000 이상과 order_items 행 36,000 이상, 열 없음, 두 세션 없음, lock_timeout·statement_timeout 0, products 대기 잠금 0, 열린 세션 ≤70. F66-R 과 같은 PostgreSQL 잠금 대기열 모드에 스키마까지 적은 이어 읽는 표 인자를 더함) + R/ssh load.north_south commerce surge.js 3rps(ramp 30s, hold 12m) checkout companion",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.ddl",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
