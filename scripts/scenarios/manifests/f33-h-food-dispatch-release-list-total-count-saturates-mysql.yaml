        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s",
            "_note": "food 진입점(동반 부하 k6 의 주문 생성 상태). 릴리스는 dispatch 의 배달 목록에 COUNT 를 붙여 MySQL 과 dispatch 풀을 말린다. order 는 용량 확인이 dispatch Hikari 대기 3초 뒤 500 이나 연결 거부로 끝나 재시도(3회)와 서킷 끝에 503 을 돌려주고, F33-R(같은 dispatch 풀 고갈, 실행 F33-R-run-73fed92a)에서 order 는 연결 가능 상태를 지켰다. 0(연결 불가)은 order 파드나 노드가 죽었을 때만 나온다"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-mysql"
            },
            "freshness": "30s",
            "_note": "food MySQL 파드. 이 주입은 MySQL 설정, 스키마, 인덱스를 건드리지 않는다. 포화되어도 Ready 여야 한다(F33-R 실행에서 전 구간 True)"
          },
          {
            "id": "order_create_2xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "_note": "동반 부하(delivery-tracking-surge.js 12rps: 추적 목록 60%, 추적 상세 15%, 주문 10%, 둘러보기 15%)의 k6 live 문서. 목록 요청 약 7.2건/초가 릴리스의 COUNT(호출당 끝난 배차 약 174만 행, 109 실측 0.44~0.53초)를 MySQL(CPU 0.5)이 감당할 수 있는 양(약 2건/초)의 3배 넘게 들이밀고, 주문 생성은 초당 약 1.2건으로 표본을 만든다. 상주 기준선의 목록 요청은 초당 약 0.1건뿐이라 동반 부하 없이는 포화되지 않는다",
            "freshness": "30s"
          },
          {
            "id": "order_create_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "freshness": "30s"
          },
