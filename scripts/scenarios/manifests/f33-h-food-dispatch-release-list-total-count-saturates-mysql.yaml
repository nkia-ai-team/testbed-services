              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 3,
              "_note": "동반 부하 12rps 의 1/4. ramping-arrival-rate(maxVUs 300)라 목록 요청이 수 초씩 걸려도 반복률이 유지된다. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "food-db-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "MySQL 파드가 빠지면 질의 비용이 아니라 DB 다운(F25-H 꼴)이다"
