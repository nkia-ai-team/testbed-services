            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "order_create_2xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.transfer_2xx_rate",
            "parameters": {
              "domain": "food-delivery"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "order-create-failed-5xx",
              "observation": "order_create_5xx_rate",
              "op": "gte",
              "value": 0.5
            },
            {
              "id": "order-create-collapsed",
              "observation": "order_create_2xx_rate",
              "op": "lt",
              "value": 0.3
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 15m. 새 dispatch 파드가 옛 파드를 대신한 뒤(약 1~2분) 목록 요청마다 COUNT 가 붙어 dispatch 풀 10개가 COUNT 에 묶이고, 용량 확인과 배차 요청이 Hikari 대기 3초 뒤 500 이 되어 order 가 재시도와 서킷 끝에 503 으로 거절한다. 로컬 실측(mysql:8.0 CPU 0.5, 끝난 배차 174만 행, 릴리스 jar, 목록 2.4건/초 = 109 의 약 6건/초에 해당): 용량 확인 120건 중 200 23건, 배차 요청 120건 중 200 23건, health 10회 중 7회 503. 2xx 기준을 0.3 으로 둔 것은 order 재시도 3회가 용량 확인과 배차 요청 각각에서 일부를 건져 2xx 가 0.1~0.3 사이를 오갈 수 있어서다(F33-R 실행 2xx 0.09~0.26). 5xx 0.5 이상과 함께면 주문 다수가 실제로 실패한 것이다"
        },
        "must_rule_out": {
          "any": [
