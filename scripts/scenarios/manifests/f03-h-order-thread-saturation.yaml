{
  "schema_version": "1.0",
  "id": "F03-H",
  "slug": "f03-h-order-thread-saturation",
  "readiness": "ready",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "commerce namespace",
    "matrix_location_transport": "K/kubectl one-shot Job",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/load.east_west",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "east-west-job-contract",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "load.east_west",
        "companion_refs": [
          "load.north_south"
        ]
      },
      "runtime": {
        "mode": "calibration",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "30m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "adaptive_ladder",
          "levels": [
            {
              "id": "below-saturation-30rps",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "job": "scenario-f03-h-order-thread-pool",
                "configmap": "scenario-f03-h-order-thread-pool",
                "node_name": "tb-w1",
                "image": "grafana/k6:latest",
                "target_url": "http://testbed-order:8080/api/orders/reports/render?days=120",
                "target_rps": 30,
                "duration_seconds": 480,
                "preallocated_vus": 64,
                "max_vus": 360
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "10m"
            },
            {
              "id": "at-saturation-45rps",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "job": "scenario-f03-h-order-thread-pool",
                "configmap": "scenario-f03-h-order-thread-pool",
                "node_name": "tb-w1",
                "image": "grafana/k6:latest",
                "target_url": "http://testbed-order:8080/api/orders/reports/render?days=120",
                "target_rps": 45,
                "duration_seconds": 480,
                "preallocated_vus": 64,
                "max_vus": 360
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "10m"
            },
            {
              "id": "past-saturation-60rps",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "job": "scenario-f03-h-order-thread-pool",
                "configmap": "scenario-f03-h-order-thread-pool",
                "node_name": "tb-w1",
                "image": "grafana/k6:latest",
                "target_url": "http://testbed-order:8080/api/orders/reports/render?days=240",
                "target_rps": 60,
                "duration_seconds": 480,
                "preallocated_vus": 64,
                "max_vus": 360
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "10m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-order"
            },
            "freshness": "30s"
          },
          {
            "id": "order_p95",
            "adapter": "prometheus",
            "query_id": "prometheus.apm_service_p95",
            "parameters": {
              "service_name": "commerce-order"
            },
            "freshness": "120s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "order-latency-damage",
              "observation": "order_p95",
              "op": "gte",
              "value": 2000
            },
            {
              "id": "checkout-impact",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.05
            }
          ],
          "consecutive_ticks": 3
        },
        "escalate": {
          "all": [
            {
              "id": "render-load-delivered",
              "observation": "order_p95",
              "op": "gte",
              "value": 2000
            },
            {
              "id": "checkout-not-impacted",
              "observation": "checkout_5xx_rate",
              "op": "lt",
              "value": 0.02
            }
          ],
          "consecutive_ticks": 4
        },
        "must_rule_out": {
          "any": [
            {
              "id": "external-rate-limit",
              "observation": "entry_status",
              "op": "eq",
              "value": 429
            },
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 15
            },
            {
              "id": "baseline-arm-also-failing",
              "observation": "checkout_5xx_rate_baseline",
              "op": "gte",
              "value": 0.02,
              "_note": "대조 팔 오염 시 실격(F19 계열과 같은 계약, `7c90e08`). 임계 0.02 는 F19 의 0.2 를 복사한 것이 아니라 이 신호의 실측에서 나왔다 — `checkout_5xx_rate_baseline` 은 기록된 런 전체에서 **0.000 이었다**(F03-H 228 표본 / F03-P 98 표본, min=p50=p99=max=0.000). 주입 중에도 움직이지 않는다는 뜻이라 이 시나리오의 대조 팔은 실제로 주입 무관하다. 0.02 는 이 컨트롤러가 이미 recovery 의 checkout-cleared/pool-restored 에서 '정리됐다'의 경계로 쓰는 값이라 새 상수를 들이지 않고 같은 값을 쓴다. 성공 임계가 0.05 로 낮으므로 대조 팔이 0.02 만 돼도 귀속 여유가 절반 이하로 줄어든다."
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "checkout-cleared",
              "observation": "checkout_5xx_rate_baseline",
              "op": "lt",
              "value": 0.02
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "load.east_west",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "load.east_west",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "load.east_west"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
