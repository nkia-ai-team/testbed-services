{
  "schema_version": "1.0",
  "id": "F03-H",
  "slug": "f03-h-order-thread-saturation",
  "readiness": "ready",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "commerce namespace",
    "matrix_location_transport": "K/kubectl one-shot Job",
    "transport": "kubectl",
    "profile_refs": [
      "injector-profiles/load.east_west",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-kubernetes-rbac",
      "east-west-job-contract",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "load.east_west",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "load.east_west"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "35m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f03-h",
              "parameters": {
                "namespace": "rca-testbed-commerce",
                "job": "scenario-f03-h-order-thread-pool",
                "configmap": "scenario-f03-h-order-thread-pool",
                "node_name": "tb-w1",
                "image": "grafana/k6:latest",
                "target_url": "http://testbed-order:8080/api/orders/reports/render?days=240",
                "target_rps": 60,
                "duration_seconds": 480,
                "preallocated_vus": 64,
                "max_vus": 360
              },
              "min_hold": "6m",
              "settle": "30s",
              "timeout": "10m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-commerce",
              "resource": "testbed-order"
            },
            "freshness": "30s"
          },
          {
            "id": "order_p95",
            "adapter": "prometheus",
            "query_id": "prometheus.apm_service_p95",
            "parameters": {
              "service_name": "commerce-order"
            },
            "freshness": "120s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "freshness": "30s"
          },
          {
            "id": "checkout_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.checkout_5xx_rate",
            "parameters": {
              "domain": "commerce"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "checkout-impact",
              "observation": "checkout_5xx_rate",
              "op": "gte",
              "value": 0.05
            }
          ],
          "consecutive_ticks": 3,
          "_note": "success 에서 `order-latency-damage`(order_p95 >= 2000) 를 뺐다 (2026-08-11). 임계를 낮춘 것이 아니라 **이 게이트에서 쓸 수 없는 신호**임이 확정됐다. 5xx 로 실패한 요청은 백분위 표본이 아니므로 order_p95 는 피해가 클수록 사라진다 — 6차 run 12752f9b 에서 24/108 틱 unusable 이고, 독립창이 60s 라 스트릭은 분당 한 번만 오르는데 피해 절정에서 5틱 연속(80s+) unusable 이 되어 D0 의 hold 상한(2x60s)을 넘겨 리셋된다. 그래서 두 조건이 실제로 함께 참인 틱이 있는데도 최대 스트릭이 1 에 머물렀다. order_p95 는 escalate 에 그대로 남아 제 몫을 한다: 서비스가 응답할 수 있을 때(=피해 없음)는 신뢰할 수 있고 escalate 는 정확히 그 경우를 판정한다. 실측 대조 — 피해 단 run 12752f9b 스트릭 16 발화(el=365), 피해 없는 단 run 8695f8d4 스트릭 0 미발화. 대조 팔(checkout_5xx_rate_baseline)이 주입 팔과 같이 움직이지만(0.52/0.52, 0.81/0.83, 1.0/1.0) 이는 오염이 아니다 — 부하 포화 시나리오라 baseline 트래픽도 같은 checkout 을 지나며, 대조군은 여기서 구조적으로 감별자가 아니다."
        },
        "must_rule_out": {
          "any": [
            {
              "id": "external-rate-limit",
              "observation": "entry_status",
              "op": "eq",
              "value": 429
            },
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 15
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "checkout-cleared",
              "observation": "checkout_5xx_rate_baseline",
              "op": "lt",
              "value": 0.02
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "load.east_west",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "load.east_west",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "load.east_west"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
