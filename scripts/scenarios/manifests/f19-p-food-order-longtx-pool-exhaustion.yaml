            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-food",
              "resource": "testbed-order"
            },
            "freshness": "30s"
          },
          {
            "id": "order_hikari_pending",
            "adapter": "prometheus",
            "query_id": "prometheus.hikari_pending_connections",
            "parameters": {
              "service_name": "food-delivery-order"
            },
            "freshness": "30s"
          },
          {
            "id": "payment_error_rate",
            "adapter": "clickhouse",
            "query_id": "clickhouse.service_error_rate",
            "parameters": {
              "service_name": "food-delivery-payment"
            },
            "freshness": "60s"
          },
          {
            "id": "order_create_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "freshness": "30s"
          },
          {
            "id": "order_create_5xx_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "parameters": {
