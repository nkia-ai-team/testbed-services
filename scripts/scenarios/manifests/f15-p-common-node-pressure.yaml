{
  "schema_version": "1.0",
  "id": "F15-P",
  "slug": "f15-p-common-node-pressure",
  "readiness": "ready",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "worker-w2",
    "matrix_location_transport": "tb-w2/ssh",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/host.stress"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "host-placement-and-oob-recovery"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "host.stress",
        "companion_refs": []
      },
      "runtime": {
        "mode": "calibration",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "30m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "adaptive_ladder",
          "levels": [
            {
              "id": "pressure-cpu2-vm1x1500m",
              "parameters": {
                "mode": "pressure",
                "host": "192.168.122.11",
                "cpu_workers": 2,
                "vm_workers": 1,
                "vm_bytes": "1500M",
                "runtime_seconds": 600
              },
              "min_hold": "4m",
              "settle": "30s",
              "timeout": "8m"
            },
            {
              "id": "pressure-cpu3-vm1x3000m",
              "parameters": {
                "mode": "pressure",
                "host": "192.168.122.11",
                "cpu_workers": 3,
                "vm_workers": 1,
                "vm_bytes": "3000M",
                "runtime_seconds": 600
              },
              "min_hold": "4m",
              "settle": "30s",
              "timeout": "8m"
            },
            {
              "id": "pressure-cpu4-vm2x2500m",
              "parameters": {
                "mode": "pressure",
                "host": "192.168.122.11",
                "cpu_workers": 4,
                "vm_workers": 2,
                "vm_bytes": "2500M",
                "runtime_seconds": 600
              },
              "min_hold": "4m",
              "settle": "30s",
              "timeout": "8m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "freshness": "30s",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-transfer"
            }
          },
          {
            "id": "node_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.node_ready",
            "freshness": "30s",
            "parameters": {
              "node": "tb-w2"
            }
          },
          {
            "id": "node_cpu_util",
            "adapter": "prometheus",
            "query_id": "prometheus.node_cpu_utilization",
            "freshness": "60s",
            "parameters": {
              "node": "tb-w2"
            }
          },
          {
            "id": "node_mem_util",
            "adapter": "prometheus",
            "query_id": "prometheus.node_memory_utilization",
            "freshness": "60s",
            "parameters": {
              "node": "tb-w2"
            }
          },
          {
            "id": "transfer_p95",
            "adapter": "prometheus",
            "query_id": "prometheus.apm_service_p95",
            "freshness": "120s",
            "parameters": {
              "service_name": "core-banking-transfer"
            }
          },
          {
            "id": "account_p95",
            "adapter": "prometheus",
            "query_id": "prometheus.apm_service_p95",
            "freshness": "120s",
            "parameters": {
              "service_name": "core-banking-account"
            }
          }
        ],
        "success": {
          "all": [
            {
              "id": "node-cpu-saturated",
              "observation": "node_cpu_util",
              "op": "gte",
              "value": 80
            },
            {
              "id": "node-memory-pressured",
              "observation": "node_mem_util",
              "op": "gte",
              "value": 75
            },
            {
              "id": "transfer-latency-damage",
              "observation": "transfer_p95",
              "op": "gte",
              "value": 4000
            },
            {
              "id": "account-latency-damage",
              "observation": "account_p95",
              "op": "gte",
              "value": 1000
            }
          ],
          "consecutive_ticks": 3
        },
        "escalate": {
          "any": [
            {
              "id": "cpu-not-yet-saturated",
              "observation": "node_cpu_util",
              "op": "lt",
              "value": 80
            },
            {
              "id": "memory-not-yet-pressured",
              "observation": "node_mem_util",
              "op": "lt",
              "value": 75
            }
          ],
          "consecutive_ticks": 3
        },
        "must_rule_out": {
          "any": [
            {
              "id": "cpu-only-pressure",
              "observation": "node_mem_util",
              "op": "lt",
              "value": 60
            },
            {
              "id": "memory-only-pressure",
              "observation": "node_cpu_util",
              "op": "lt",
              "value": 50
            },
            {
              "id": "node-lost",
              "observation": "node_ready",
              "op": "eq",
              "value": false
            }
          ],
          "consecutive_ticks": 3
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            },
            {
              "id": "node-notready-total-collapse",
              "observation": "node_ready",
              "op": "eq",
              "value": false
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "pod-recovered",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "node-cpu-normal",
              "observation": "node_cpu_util",
              "op": "lt",
              "value": 30
            },
            {
              "id": "node-memory-normal",
              "observation": "node_mem_util",
              "op": "lt",
              "value": 60
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "host.stress"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "host.stress"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "host.stress"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
