        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f60-r",
              "parameters": {
                "engine": "mysql",
                "namespace": "rca-testbed-food",
                "pod": "testbed-mysql-0",
