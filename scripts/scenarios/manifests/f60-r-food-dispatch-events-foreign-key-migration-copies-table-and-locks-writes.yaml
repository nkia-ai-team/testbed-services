            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "food-delivery"
            },
            "_note": "기준선 문서(loadgen-food)의 주문 생성 단계(30180 → order) 상태. 동반 부하가 없어 기준선 문서를 읽는다. 복사가 도는 동안 order 는 배차 요청(5초 시간 제한, 3회)과 용량 확인(dispatch 풀 대기 3초) 실패 끝에 503 으로 답하고, dispatch 가 NotReady 가 되면 연결 거부를 곧바로 503 으로 바꾼다. order 자신의 표는 잠기지 않는다. 0(연결 불가)은 order 파드가 빠지거나 노드가 죽었을 때만 나온다",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
