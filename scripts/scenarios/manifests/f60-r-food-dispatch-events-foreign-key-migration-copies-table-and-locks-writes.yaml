          "consecutive_ticks": 2,
          "_note": "min_hold 60s, 2틱. 이 고장은 스스로 끝난다: 마이그레이션의 표 복사가 끝나면 막힌 쓰기가 풀린다. 109 testbed-mysql-0 은 평시 거의 한가하고(cgroup CPU 약 2%, active_session 중앙 1) 같은 판, 같은 크기의 로컬 실측이 한가할 때 76~97초라 복사는 약 60~100초로 본다. 판정에 쓰는 두 관측(loadgen.food_create_status_rate, loadgen.transfer_2xx_rate)은 update_interval 30초라 연속 틱은 표본 사이가 30초 이상일 때만 오른다(adaptive.py _independence_sec, _updated_streaks). 주입 뒤 수 초 안에 배차 INSERT 가 막히고 첫 주문들은 약 16초 뒤 503, 약 5~15초에 dispatch 풀이 비어 그 뒤 주문은 곧바로 503 이라, 30초 창이 처음 조건을 넘는 표본은 약 30~45초, 둘째 표본은 약 60~75초에 찍힌다. 둘째 창(약 30~75초)이 통째로 복사 안에 들어 min_hold 60s 직후 성공한다. 3틱이면 셋째 창(약 60~105초)이 복사 끝(약 76~97초)과 회복(readiness 10초, 서킷 5초)에 걸려 깨질 수 있어 2틱으로 둔다(같은 2틱 선례 controller 15개). cleanup 이 복사가 끝나기를 기다리므로(최대 300초) 녹화에는 복사 전체가 담긴다. timeout 6m 은 복사가 늦게 시작해도 받는다"
        },
        "must_rule_out": {
