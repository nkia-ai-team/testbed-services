{
  "schema_version": "1.0",
  "id": "F72-P",
  "slug": "f72-p-petition-router-acl-resets-was-to-db",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "civil-petition rt-core01",
    "matrix_location_transport": "V/ssh router.config(civil-petition rt-core01, 실행기 opsjob 이 상시 관리 연결로 가드를 건 뒤 운영자 sysop 이 192.168.127.5 에서 ssh 로그인해 sudo nft -f, 적용 직후 66 터널 핑과 표 확인)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/router.config"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "network-oob-recovery"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "router.config",
        "companion_refs": [],
        "approved_profile_id": "router.config"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "20m",
        "preflight": [
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "target-health",
          "vm-entry-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "target-health"
            },
            {
              "check": "vm-entry-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f72-p",
              "parameters": {
                "host": "192.168.127.2",
                "node": "rt-core01",
                "table": "db-acl",
                "rules": [
                  {
                    "hook": "forward",
                    "proto": "tcp",
                    "dst": "192.168.126.11/32",
                    "dport": 5432,
                    "verdict": "reset"
                  }
                ],
                "routes": [],
                "sysctls": {},
                "log_prefix": "[DB ACL] "
              },
              "min_hold": "10m",
              "settle": "60s",
              "timeout": "15m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "civil-petition"
            },
            "_note": "민원 포털 상주 부하기(loadgen VM)의 마지막 민원 신청 상태. 규칙은 DB 로 가는 연결을 TCP 재설정으로 바로 끊으므로 앱이 몇 ms 안에 500(트랜잭션을 열지 못함)으로 답한다. 0(응답 없음)은 웹 서버나 라우터 상향이 죽었을 때만 나온다(drop 이면 연결 시간 초과 10초가 부하기 시간 제한 10초와 겹쳐 0 이 됐을 것이라 reset 을 쓴다)",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s",
            "_note": "전역 회복 조건(다른 테스트베드 진입). 이 시나리오는 건드리지 않는다"
          },
          {
            "id": "lookup_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "civil-petition"
            },
            "_note": "상주 부하의 접수번호 조회(단계 lookup, 여정 30%, 웹 → WAS → DB 기본 키 조회) 비정상 비율. 조회는 쿠키 단지 없이 부르는 공개 경로라 장애 중 로그인 상태가 풀려도 사라지지 않는다(신청, 내 민원, 담당자 처리는 로그인이 DB 를 거쳐 실패하면 요청 자체가 사라진다). 30초 창에 저점 5rps 에서도 약 45건. 평시 약 0.01(없는 번호 조회 1% 고정이 404). 규칙이 들어가면 503('database unavailable')",
            "freshness": "30s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "parameters": {
              "domain": "civil-petition"
            },
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "lookups-failing",
              "observation": "lookup_nonok_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "접수번호 조회가 DB 연결 거부로 503"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "규칙이 들어간 다음 요청부터 실패한다(열린 풀 연결도 다음 패킷에 재설정되고 새 연결은 바로 거부). 신청 단계는 성공 조건에 쓰지 않는다: 장애 중 재로그인 여정이 실패해 로그인 상태가 풀린 가상 사용자는 신청 요청을 보내지 않아, 몇 분 뒤 30초 창에 신청이 0건이 되고 그 비율이 실리지 않는다(1회차 평가 차단 1). min_hold 10m 은 피해와 원인 흔적(라우터 커널 차단 줄 분당 최대 6, WAS 오류 줄, NMS ens21 송신 감소 60초 폴링 여러 점)이 쌓일 길이다"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 2.0,
              "_note": "상주 부하 저점(KST 4시) 목표 5rps 의 40%. 부하가 실제로 끊겼을 때만 발화한다(빠른 503 은 도착률을 바꾸지 않는다)"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "entry-recovered",
              "observation": "entry_status",
              "op": "eq",
              "value": 200
            },
            {
              "id": "lookups-recovered",
              "observation": "lookup_nonok_rate",
              "op": "lt",
              "value": 0.1,
              "_note": "평시 창별 비정상 비율은 없는 번호 1% 때문에 저점 5rps 30초 창에서 최대 약 0.055(모의)라 0.05 가 아니라 0.1 로 둔다. 장애 중 값은 1.0"
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "10m",
          "_note": "cleanup 은 운영자가 다시 로그인해 sudo nft delete table inet db-acl 과 rm -f 로 파일을 지우고, 남은 것은 실행기가 root 로 지운 뒤 가드를 푼다. 표가 사라지면 풀이 다음 요청에서 새 연결을 맺어 바로 정상이 된다. entry_status 200 은 로그인이 풀렸던 가상 사용자가 다시 로그인한 뒤의 첫 신청이다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "5m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "router.config"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "router.config"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "router.config"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
