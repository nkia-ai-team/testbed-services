              "value": 0.5,
              "_note": "대사 조회 한 건(page 없는 30일 완료 이체, 약 210만 행)을 transfer 가 Pageable.unpaged() 로 전부 엔티티 목록에 올리다 힙(-Xmx512m)이 차서 Serial GC 전체 수집이 잇따르고 OutOfMemoryError 로 Tomcat 요청 처리가 멈춘다(로컬 실측: 같은 jar, 0.5 CPU, 1GiB, 같은 행 수에서 조회 한 건으로 약 50초 만에 이체 응답이 끊기고 acceptor 스레드가 죽어 liveness 가 응답 없음). 그동안 account → transfer 이체 호출이 시간 초과와 서킷 열림으로 끝나 api 가 이체를 502 로 답한다. 재기동 뒤 대사 시스템이 다시 부르면 같은 일이 되풀이된다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 10m: 동반 부하 경사 2분 뒤 대사 조회가 시작되고 한 주기(멈춤 약 1분, liveness 재시작 약 75초, 기동 약 1~1.5분, 다음 조회까지)가 약 4분이라 10분이 지나면 세 번째 안팎의 실패 구간 안에서 판정된다. timeout 16m 은 부하 길이(경사 2m + 유지 13m + 내림 1m)와 같다(primary 부하 계약)"
        },
