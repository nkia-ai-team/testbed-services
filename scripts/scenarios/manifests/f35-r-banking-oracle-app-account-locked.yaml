{
  "schema_version": "1.0",
  "id": "F35-R",
  "slug": "f35-r-banking-oracle-app-account-locked",
  "readiness": "ready",
  "stage": "candidate",
  "authoritative_sources": {
    "catalog": "scripts/scenarios/catalog.json",
    "execution_matrix": "docs/spec-scenario-execution-matrix.md"
  },
  "injection": {
    "location": "tb-runner",
    "matrix_location_transport": "R/ssh db.account banking testbed-oracle-0 ACCOUNT LOCK(kubectl exec sqlplus / as sysdba, 역 문장 ACCOUNT UNLOCK), + R/ssh load.north_south companion(core-banking surge.js, target_rps=10, 기준선 1~4 iter/s 위, core-banking-api 표본 스팬 확보)",
    "transport": "ssh",
    "profile_refs": [
      "injector-profiles/db.account",
      "injector-profiles/load.north_south"
    ]
  },
  "execution": {
    "preflight_ids": [
      "catalog-integrity",
      "canonical-kubeconfig",
      "global-dirty-lease",
      "baseline-clean-window",
      "target-health",
      "profile-prerequisites",
      "transport-ssh-access",
      "db-inverse-ddl-ready",
      "baseline-loadgen-active"
    ],
    "controller": {
      "dispatcher_mode": "trusted",
      "live_enabled": true,
      "binding": {
        "primary_ref": "db.account",
        "companion_refs": [
          "load.north_south"
        ],
        "approved_profile_id": "db.account"
      },
      "runtime": {
        "mode": "evaluation",
        "tick_interval": "15s",
        "settle_after_change": "30s",
        "max_injection_duration": "30m",
        "preflight": [
          "kube-context",
          "kube-node-set",
          "coordinator-clean",
          "clean-window",
          "baseline-traffic",
          "baseline-business-success",
          "target-health"
        ],
        "baseline": {
          "clean_window": "30m",
          "required": [
            {
              "check": "coordinator-clean"
            },
            {
              "check": "clean-window"
            },
            {
              "check": "baseline-traffic"
            },
            {
              "check": "baseline-business-success"
            },
            {
              "check": "target-health"
            }
          ]
        },
        "profile": {
          "kind": "fixed",
          "levels": [
            {
              "id": "approved-fixed-f35-r",
              "parameters": {
                "engine": "oracle",
                "namespace": "rca-testbed-banking",
                "pod": "testbed-oracle-0",
                "pdb": "FREEPDB1",
                "account": "BANKING"
              },
              "min_hold": "21m",
              "settle": "60s",
              "timeout": "27m"
            }
          ]
        },
        "observations": [
          {
            "id": "entry_status",
            "adapter": "http_probe",
            "query_id": "http.entry_health",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "기준선 문서의 이체 단계(nginx → api) 상태. api 와 nginx 는 DB 를 쓰지 않아 잠금 중에도 살아 있고 502 로 답하므로, 0(연결 불가)은 nginx 나 노드가 죽었을 때만 나온다",
            "freshness": "15s"
          },
          {
            "id": "target_health",
            "adapter": "http_probe",
            "query_id": "http.target_health",
            "freshness": "15s"
          },
          {
            "id": "pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-oracle"
            },
            "freshness": "30s"
          },
          {
            "id": "transfer_pod_ready",
            "adapter": "kubernetes",
            "query_id": "kubernetes.pod_ready",
            "parameters": {
              "namespace": "rca-testbed-banking",
              "resource": "testbed-transfer"
            },
            "freshness": "30s"
          },
          {
            "id": "balance_read_nonok_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "_note": "동반 부하(core-banking surge.js 10rps)의 잔액 조회(step get, 55%, nginx → account) 실패율. 30초 창에 약 165건. 평시 0",
            "freshness": "30s"
          },
          {
            "id": "transfer_5xx_rate",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.food_create_status_rate",
            "_note": "동반 부하의 이체(step transfer, 10%, nginx → api → account → transfer) 5xx 비율. 질의 이름은 food 이지만 선택자는 도메인 공통 business.5xx.rate 다. 평시 업무 거절은 400(잔액 부족)이라 5xx 는 0",
            "freshness": "30s"
          },
          {
            "id": "achieved_rps",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.achieved_rps",
            "freshness": "30s"
          },
          {
            "id": "balance_read_nonok_rate_baseline",
            "adapter": "loadgen_summary",
            "query_id": "loadgen.read_step_status_rate",
            "parameters": {
              "domain": "core-banking"
            },
            "_note": "상주 기준선(loadgen-banking)의 잔액 조회 실패율. 동반 부하가 끝난 뒤의 회복 판정에 쓴다",
            "freshness": "30s"
          }
        ],
        "success": {
          "all": [
            {
              "id": "balance-reads-failing",
              "observation": "balance_read_nonok_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "account 풀이 비면 잔액 조회가 3초 대기 뒤 500, readiness 가 빠진 뒤에는 nginx 502 가 된다"
            },
            {
              "id": "transfers-failing-5xx",
              "observation": "transfer_5xx_rate",
              "op": "gte",
              "value": 0.5,
              "_note": "api 가 account 호출 거절과 서킷 열림으로 502 를 낸다. 이 502 가 core-banking-api 서버 스팬을 ERROR 로 만들어 골든 시그널 오류율을 올린다"
            }
          ],
          "consecutive_ticks": 3,
          "_note": "min_hold 21m: 잠금 뒤 풀이 모두 비는 최악 시각이 약 10.5분(max-lifetime 10분 + readiness 30초)이라, 최악의 경우에도 전면 실패가 약 10.5분 이어진 뒤 판정된다(F17-R 의 실패 구간 수준)"
        },
        "must_rule_out": {
          "any": [
            {
              "id": "load-not-delivered",
              "observation": "achieved_rps",
              "op": "lt",
              "value": 2.5,
              "_note": "동반 부하 10rps 의 1/4. 부하가 실제로 끊겼을 때만 발화한다"
            },
            {
              "id": "banking-db-down",
              "observation": "pod_ready",
              "op": "eq",
              "value": false,
              "_note": "Oracle 파드가 빠지면 계정 잠금이 아니라 DB 다운(F25-H 꼴)이다"
            }
          ],
          "consecutive_ticks": 2
        },
        "abort": {
          "any": [
            {
              "id": "entry-unreachable",
              "observation": "entry_status",
              "op": "eq",
              "value": 0
            }
          ],
          "consecutive_ticks": 2
        },
        "recovery": {
          "all": [
            {
              "id": "target-recovered",
              "observation": "target_health",
              "op": "eq",
              "value": 200
            },
            {
              "id": "db-ready",
              "observation": "pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "transfer-ready",
              "observation": "transfer_pod_ready",
              "op": "eq",
              "value": true
            },
            {
              "id": "balance-reads-recovered",
              "observation": "balance_read_nonok_rate_baseline",
              "op": "lt",
              "value": 0.05
            }
          ],
          "consecutive_ticks": 2,
          "timeout": "15m",
          "_note": "보통은 잠금 해제 뒤 1분 안에 회복한다. 15m 은 잠금 중 banking 파드가 다른 이유로 재시작된 경우의 여유다: 시작 단계 DB 확인이 실패해 startupProbe(30회 x 5초)로 재시작이 반복되면 해제 뒤 CrashLoopBackOff 대기(최대 5분)와 기동(약 1~2.5분)을 기다려야 한다"
        },
        "cleanup": {
          "required": true,
          "order": "reverse",
          "timeout": "10m"
        },
        "capture": {
          "enabled": true,
          "pre_window": "10m",
          "post_window": "20m",
          "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json",
          "create_golden_anomaly": false
        }
      }
    }
  },
  "actions": {
    "plan": {
      "mode": "dry-run",
      "mutation": false,
      "adapter_refs": [
        "db.account",
        "load.north_south"
      ]
    },
    "run": {
      "mode": "dry-run",
      "mutation": false,
      "requires_preflight": true,
      "adapter_refs": [
        "db.account",
        "load.north_south"
      ]
    },
    "cleanup": {
      "mode": "dry-run",
      "mutation": false,
      "required": true,
      "order": "reverse",
      "recovery_gate": true,
      "adapter_refs": [
        "load.north_south",
        "db.account"
      ]
    }
  },
  "prerequisite_gate": {
    "state": "satisfied",
    "required": false,
    "description": "none",
    "live_allowed": true
  },
  "capture_policy": {
    "policy_ref": "focused-window-v1",
    "time_basis": "UTC",
    "t1": "earliest-actual-effect-start",
    "t2": "latest-load-end-or-fault-release",
    "query_window": "[t1-10m,t2+20m]",
    "export_not_before": "t2+20m",
    "model_snapshot": "/var/lib/lucida/ai-models/stream-anomaly/global/v1/model.json@t2+20m",
    "create_golden_anomaly": false,
    "allowed_case_labels": [
      "calibration",
      "evaluation",
      "failed"
    ]
  }
}
